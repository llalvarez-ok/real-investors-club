<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(160deg,#071426 0%,#0a1a33 55%,#0d2142 100%);position:relative;font-family:'IBM Plex Sans',sans-serif;color:#ecf1f9}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,160,220,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,220,.06) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;width:900px;height:900px;left:-250px;bottom:-520px;background:radial-gradient(circle,rgba(199,163,94,.16),transparent 65%)}
.pant{position:absolute;left:36px;top:26px;width:1848px;height:734px;border:2px solid #274a80;border-radius:14px;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.cam{position:absolute;left:1360px;top:768px;width:524px;height:296px;border:2px solid #8e7140;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.info{position:absolute;left:40px;top:784px;width:1290px}
.eti{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;letter-spacing:.14em;color:#a3b5d1;text-transform:uppercase}
.eti b{color:#c7a35e;font-weight:600}
.tit{font-family:'Archivo',sans-serif;font-weight:900;font-size:50px;letter-spacing:-.01em;margin-top:6px}
.tit span{color:#e2c68c}
.logo{position:absolute;left:1188px;top:786px;width:130px;opacity:.95}
.barra{position:absolute;left:40px;bottom:16px;font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.12em;color:#5d7396}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="pant"></div><div class="cam"></div>
<div class="info"><div class="eti"><b>Clase 14</b> · Básicos del trading</div><div class="tit"><span>Order blocks</span>: originales y decisionales</div></div>
<img class="logo" src="../../marca/logo.svg">
<div class="barra">LEAN ALVAREZ · REAL INVESTORS CLUB · REALINVESTORS.CLUB</div>
</body></html>
