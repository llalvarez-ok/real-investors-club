<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(160deg,#071426,#0d2142);color:#ecf1f9;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,160,220,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,220,.06) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;width:1200px;height:800px;left:360px;top:140px;background:radial-gradient(ellipse,rgba(199,163,94,.14),transparent 65%)}
img{width:360px;position:relative}
.eti{position:relative;margin-top:56px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:28px;letter-spacing:.18em;color:#a3b5d1;text-transform:uppercase}
.eti b{color:#c7a35e;font-weight:600}
.tit{position:relative;margin-top:14px;font-family:'Archivo',sans-serif;font-weight:900;font-size:92px;letter-spacing:-.015em}
.tit span{color:#e2c68c}
.sub{position:relative;margin-top:10px;font-size:34px;color:#a3b5d1}
.aviso{position:absolute;bottom:60px;font-size:24px;color:#a3b5d1}
.web{position:relative;margin-top:40px;font-family:'IBM Plex Mono',monospace;font-size:40px;letter-spacing:.06em;color:#e2c68c}
</style></head><body><div class="grid"></div><div class="glow"></div>
<img src="../../marca/logo.svg">

</body></html>
