<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Efectos a cámara</title>
<!-- Efectos sobre un video de Lean hablando a cámara (herramientas/efectos/LEEME.md).
     efectos.html?dir=<dir de trabajo de preparar.py>&cfg=<archivo .js con window.CFG>
     Capas: fondo (con «foco») → efectos detrás (título, cristal, órbita de atrás) → Lean recortado → efectos delante
     (checklist, órbita de adelante) → subtítulos palabra por palabra y marca. Expone window.cuadro(t) para render.js. -->
<script>
  const Q = new URLSearchParams(location.search), DIR = Q.get('dir'), CFGJS = Q.get('cfg');
  document.write(`<script src="${DIR}/clip.js"><\/script><script src="${CFGJS}"><\/script>`);
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070c; }
  canvas { position: absolute; left: 0; top: 0; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function () {
  const W = 1080, H = 1920, C = window.CLIP, F = window.CFG || {}, x = document.getElementById('c').getContext('2d');
  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), eo = v => 1 - Math.pow(1 - v, 3);
  const ORO = ['#ffe9b0', '#e2c68c', '#c7a35e'], FUENTE = '"Inter Display", "Archivo", Inter, sans-serif';
  const pal = C.palabras || [];
  // tiempo de un ancla: {w: índice de palabra} | {s: segundos} | {txt: "palabra", n: ocurrencia}
  const ancla = (a, def) => {
    if (!a) return def;
    if (a.s !== undefined) return a.s;
    if (a.w !== undefined) return pal[Math.min(a.w, pal.length - 1)][0] + (a.o || 0);
    if (a.txt) { const k = a.txt.toLowerCase(); let n = a.n || 1;
      for (const p of pal) if (p[2].toLowerCase().replace(/[^\wáéíóúñü]/g, '') === k && --n === 0) return p[0] + (a.o || 0); }
    return def;
  };
  const DUR = C.n / C.fps;
  const EF = (F.efectos || []).map(e => ({ ...e, t0: ancla(e.desde, 0), t1: ancla(e.hasta, DUR) }));
  const activo = (e, t) => t >= e.t0 && t <= e.t1;
  const entrada = (e, t, d = .45) => eo(cl((t - e.t0) / d)) * cl((e.t1 + .3 - t) / .3);
  const IMGS = {};
  (F.efectos || []).forEach(e => (e.imagenes || []).forEach(s => { if (!IMGS[s]) { const i = new Image(); i.src = s; IMGS[s] = i; } }));
  const cargar = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

  function redondo(c, X, Y, w, h, r) { c.beginPath(); c.roundRect(X, Y, w, h, r); }
  function texto(c, s, X, Y, px_, peso = 900, alin = 'center', col = '#f5f5f2') {
    c.font = `${peso} ${px_}px ${FUENTE}`; c.textAlign = alin; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s, X, Y);
  }

  // ---- efectos detrás de Lean ----
  function titulo(e, t, cab) {
    const a = entrada(e, t, .6); if (a <= 0) return;
    const s = e.tam || 250, y = e.y || cl(cab[1] + 260, 520, 1100), g = x.createLinearGradient(0, y - s / 2, 0, y + s / 2);
    ORO.forEach((c, i) => g.addColorStop(i / 2, c));
    x.save(); x.globalAlpha = a; x.translate(W / 2, y); x.scale(1.25 - .25 * a, 1.25 - .25 * a);
    x.font = `900 ${s}px ${FUENTE}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const ancho = Math.max(...(e.texto || '').split('\n').map(l => x.measureText(l.toUpperCase()).width)); if (ancho > 980) x.scale(980 / ancho, 980 / ancho);
    x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 40; x.fillStyle = g;
    (e.texto || '').split('\n').forEach((l, i, ls) => x.fillText(l.toUpperCase(), 0, (i - (ls.length - 1) / 2) * s * .92));
    x.restore();
  }
  function cristal(e, t, cab, cuadro) {
    const a = entrada(e, t, .7); if (a <= 0) return;
    const ps = e.paneles || [];
    ps.forEach((p, i) => {
      const lado = i % 2 ? 1 : -1, fila = Math.floor(i / 2);
      const w = p.ancho || 400, h = p.alto || 170;
      const X = cl(W / 2 + lado * (cab[2] * .55 + 70 + w / 2) - w / 2, 40, W - 40 - w) + Math.sin(t * .9 + i) * 10;
      const Y = cl(p.y || cab[1] - 120 + fila * 260, 320, 1150) + Math.cos(t * 1.1 + i * 2) * 14 + (1 - a) * 80;
      const aa = a * cl((t - e.t0 - i * .25) / .4);
      if (aa <= 0) return;
      x.save(); x.globalAlpha = aa; redondo(x, X, Y, w, h, 28); x.clip();
      x.filter = 'blur(18px) brightness(1.15)'; x.drawImage(cuadro, -20, -20, W + 40, H + 40); x.filter = 'none';
      x.fillStyle = 'rgba(255,255,255,.10)'; x.fillRect(X, Y, w, h);
      const g = x.createLinearGradient(X, Y, X + w, Y + h); g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(.5, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(X, Y, w, h); x.restore();
      x.save(); x.globalAlpha = aa; redondo(x, X, Y, w, h, 28); x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 2; x.stroke();
      if (p.titulo) texto(x, p.titulo, X + w / 2, Y + h * .38, 30, 700, 'center', 'rgba(245,245,242,.75)');
      if (p.valor) texto(x, p.valor, X + w / 2, Y + h * .68, 54, 900, 'center', p.color || ORO[1]);
      x.restore();
    });
  }
  function orbita(e, t, cab, adelante) {
    const a = entrada(e, t, .6); if (a <= 0) return;
    const ims = e.imagenes || [], n = ims.length || 1, rx = e.rx || Math.max(260, cab[2] * 1.3), ry = e.ry || 70;
    ims.forEach((s, i) => {
      const ang = t * (e.vel || .9) + i * Math.PI * 2 / n, z = Math.sin(ang);
      if ((z >= 0) !== adelante) return;
      const im = IMGS[s]; if (!im || !im.complete) return;
      const k = (.75 + .25 * z) * (e.tam || 240), X = W / 2 + Math.cos(ang) * rx, Y = cl(cab[1] - 60, 380, 1100) + z * ry;
      x.save(); x.globalAlpha = a * (.65 + .35 * z); x.translate(X, Y); x.rotate(Math.cos(ang) * .12);
      redondo(x, -k / 2, -k * .28, k, k * .56, 16); x.clip(); x.drawImage(im, -k / 2, -k * .28, k, k * .56); x.restore();
      x.save(); x.globalAlpha = a * (.65 + .35 * z); x.translate(X, Y); x.rotate(Math.cos(ang) * .12);
      redondo(x, -k / 2, -k * .28, k, k * .56, 16); x.strokeStyle = ORO[1]; x.lineWidth = 3; x.stroke(); x.restore();
    });
  }
  // ---- efectos delante de Lean ----
  function checklist(e, t) {
    const a = entrada(e, t, .5); if (a <= 0) return;
    const items = e.items || [], X = e.x || 140, Y0 = e.y || 330, w = e.ancho || 600, fila = 108;
    x.save(); x.globalAlpha = a * .9; redondo(x, X - 30, Y0 - 40 - (1 - a) * 40, w + 60, items.length * fila + 50, 30);
    x.fillStyle = 'rgba(7,12,24,.78)'; x.fill(); x.strokeStyle = 'rgba(226,198,140,.55)'; x.lineWidth = 2; x.stroke(); x.restore();
    items.forEach((it, i) => {
      const y = Y0 + i * fila + 20, tk = ancla(it.marca, 1e9), q = eo(cl((t - tk) / .35));
      x.save(); x.globalAlpha = a;
      x.beginPath(); x.arc(X + 26, y, 26, 0, 7); x.lineWidth = 4; x.strokeStyle = q > 0 ? ORO[1] : 'rgba(245,245,242,.5)'; x.stroke();
      if (q > 0) { x.fillStyle = ORO[1]; x.globalAlpha = a * q; x.beginPath(); x.arc(X + 26, y, 26 * q, 0, 7); x.fill();
        x.globalAlpha = a; x.strokeStyle = '#0b0f1d'; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath();
        x.moveTo(X + 13, y + 1); x.lineTo(X + 13 + 9 * cl(q * 2), y + 1 + 9 * cl(q * 2)); if (q > .5) x.lineTo(X + 22 + 18 * cl((q - .5) * 2), y + 10 - 22 * cl((q - .5) * 2)); x.stroke(); }
      texto(x, it.txt, X + 74, y, 40, 800, 'left', q > 0 ? '#f5f5f2' : 'rgba(245,245,242,.72)');
      x.restore();
    });
  }
  // ---- subtítulos palabra por palabra (zona segura: y ≈ 1330) ----
  const CLAVE = F.clave ? new RegExp(F.clave, 'i') : /x^/;
  const grupos = []; { let g = []; pal.forEach((w, i) => { g.push(w); const s = pal[i + 1];
    if (!s || /[.,?:!]$/.test(w[2]) || g.length >= 3 || s[0] - w[1] > .3) { grupos.push(g); g = []; } }); }
  function subtitulos(t) {
    if (F.subtitulos === false) return;
    const g = grupos.find(g => t >= g[0][0] - .05 && t < g[g.length - 1][1] + .25); if (!g) return;
    x.save(); x.font = `900 66px ${FUENTE}`; x.textBaseline = 'middle';
    const ps = g.map(w => w[2].toUpperCase()), ws = ps.map(p => x.measureText(p).width), esp = 18, tot = ws.reduce((a, b) => a + b, 0) + esp * (ps.length - 1);
    let X = W / 2 - tot / 2; const Y = F.subY || 1330;
    ps.forEach((p, i) => { const on = t >= g[i][0] - .03, k = CLAVE.test(g[i][2]);
      x.shadowColor = 'rgba(0,0,0,.9)'; x.shadowBlur = 18; x.lineWidth = 10; x.strokeStyle = 'rgba(0,0,0,.55)'; x.textAlign = 'left';
      x.strokeText(p, X, Y); x.fillStyle = on ? (k ? '#ffcf5a' : '#f5f5f2') : 'rgba(245,245,242,.35)'; x.fillText(p, X, Y); X += ws[i] + esp; });
    x.restore();
  }

  window.EVENTOS = [];
  window.listo = Promise.all(Object.values(IMGS).map(i => i.decode().catch(() => 0))).then(() => document.fonts.ready);
  window.cuadro = async function (t) {
    const i = Math.min(C.n - 1, Math.round(t * C.fps)), n = String(i).padStart(5, '0');
    const [cuadro, alfa] = await Promise.all([cargar(`${DIR}/cuadros/${n}.jpg`), cargar(`${DIR}/alfa/${n}.png`)]);
    const cab = C.cabeza[i];
    // fondo (con foco: más oscuro y con viñeta)
    const foco = EF.filter(e => e.tipo === 'foco' && activo(e, t)).reduce((m, e) => Math.max(m, entrada(e, t, .5)), 0);
    x.globalAlpha = 1; x.filter = foco > 0 ? `brightness(${1 - .65 * foco}) saturate(${1 - .4 * foco})` : 'none';
    x.drawImage(cuadro, 0, 0, W, H); x.filter = 'none';
    if (foco > 0) { const v = x.createRadialGradient(cab[0], cab[1] + 300, 200, cab[0], cab[1] + 300, 1100);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${.6 * foco})`); x.fillStyle = v; x.fillRect(0, 0, W, H); }
    const hay = tipo => EF.filter(e => e.tipo === tipo && activo(e, t));
    hay('titulo').forEach(e => titulo(e, t, cab));
    hay('cristal').forEach(e => cristal(e, t, cab, cuadro));
    hay('orbita').forEach(e => orbita(e, t, cab, false));
    // Lean recortado (solo hace falta si hay algo detrás de él o foco)
    if (foco > 0 || hay('titulo').length || hay('cristal').length || hay('orbita').length) {
      x.drawImage(maskear(cuadro, alfa), 0, 0);
    }
    hay('orbita').forEach(e => orbita(e, t, cab, true));
    hay('checklist').forEach(e => checklist(e, t));
    subtitulos(t);
    // marca
    x.save(); x.font = `800 26px ${FUENTE}`; x.textAlign = 'left'; x.fillStyle = ORO[1]; x.letterSpacing = '6px';
    x.shadowColor = 'rgba(0,0,0,.7)'; x.shadowBlur = 10; x.fillText(F.marca || 'REAL INVESTORS CLUB', 150, 280); x.restore();
  };
  // máscara: la silueta gris (blanco = Lean) como canal alfa del cuadro
  const mk = document.createElement('canvas'); mk.width = W; mk.height = H; const mx = mk.getContext('2d', { willReadFrequently: true });
  const al = document.createElement('canvas'); al.width = W; al.height = H; const ax = al.getContext('2d', { willReadFrequently: true });
  function maskear(cuadro, alfa) {
    mx.clearRect(0, 0, W, H); mx.drawImage(cuadro, 0, 0, W, H); ax.drawImage(alfa, 0, 0, W, H);
    const d = mx.getImageData(0, 0, W, H), m = ax.getImageData(0, 0, W, H).data;
    for (let k = 3; k < d.data.length; k += 4) d.data[k] = m[k - 3];
    mx.putImageData(d, 0, 0); return mk;
  }
})();
</script>
</body></html>
