<!-- P10 "FOMO: el error que te hace comprar en el peor momento" en pizarra. Motor: herramientas/animaciones/pizarra.js.
     Los tiempos salen de tiempos.js (herramientas/tiempos_pizarra.py): cada elemento aparece cuando la voz dice su palabra.
     Cada escena ocupa una zona del lienzo; las coordenadas de los elementos son relativas al centro de su zona. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@600&display=swap');

const VERDE = "#1f9d63", ROJO = "#d93a3f", ORO = "#b8913f", GRIS = "#7d8597";
const T = window.TIEMPOS, FALTAN = (window.FALTAN = []);
// Zona de cada escena (la 7, la 8 y la 9 comparten el gráfico)
const ZONA = [0, 0, 1, 2, 3, 4, 5, 6, 6, 6, 7, 8, 9, 10, 11, 12, 13];
const centro = (z) => { const fila = Math.floor(z / 4); let col = z % 4; if (fila % 2) col = 3 - col; return [col * 2600, fila * 1500]; };
let S = 1, B = [0, 0];
const en = (s) => { S = s; B = centro(ZONA[s]); };
const ini = (s = S) => T.escenas[s - 1].ini, fin = (s = S) => T.escenas[s - 1].ini + T.escenas[s - 1].dur;
const norm = (x) => x.toLowerCase().replace(/[^\wáéíóúüñ]/g, "");
function w(palabra, n = 1, desfase = 0) {
  const ps = T.escenas[S - 1].palabras, q = norm(palabra);
  let k = 0;
  for (const p of ps) if (p.p === q && ++k === n) return p.t + desfase;
  FALTAN.push(`${S}:${palabra}#${n}`);
  return ini() + 1;
}
const E = [];
// add: coordenadas relativas a la zona; respira hasta el final de la escena
function add(o) {
  const r = { ...o, x: B[0] + (o.x || 0), y: B[1] + (o.y || 0) };
  if (o.respira) r.respira = { hasta: fin() };
  if (o.desde) { r.desde = [B[0] + o.desde[0], B[1] + o.desde[1]]; r.hasta = [B[0] + o.hasta[0], B[1] + o.hasta[1]]; r.x = 0; r.y = 0; }
  E.push(r);
  return r;
}
const txt = (texto, x, y, t, o = {}) => add({ tipo: "texto", texto, x, y, t, tam: 64, ancla: "middle", d: Math.min(1.4, 0.25 + texto.length * 0.045), ...o });
const img = (src, x, y, w_, t, o = {}) => add({ tipo: "img", src, x, y, w: w_, t, d: 1.2, ...o });
const trazo = (d, t, o = {}) => add({ tipo: "trazo", d, t, dur: 0.5, ...o });
const tilde = (x, y, t) => trazo(`M${x - 22} ${y} L${x - 4} ${y + 20} L${x + 30} ${y - 26}`, t, { color: VERDE, grosor: 11, dur: 0.35 });
const tacha = (x1, y1, x2, y2, t) => trazo(`M${x1} ${y1} L${x2} ${y2}`, t, { color: ROJO, grosor: 12, dur: 0.3 });
const subraya = (x1, x2, y, t, color = ORO) => trazo(`M${x1} ${y} Q${(x1 + x2) / 2} ${y + 16} ${x2} ${y - 4}`, t, { color, grosor: 10, dur: 0.45 });

// Cámara: llega a cada zona apenas empieza su escena; en el resumen, primero se aleja para mostrar toda la pizarra
const cam = [{ t: 0, x: centro(0)[0], y: centro(0)[1], zoom: 1 }];

    continue;
  }
  en(s);
  cam.push({ t: ini() + 0.35, x: B[0], y: B[1], zoom: s === 7 ? 0.92 : 1, dur: 1.1 });
}

Pizarra.escena({ dur: T.total, elementos: E, camara: cam });
