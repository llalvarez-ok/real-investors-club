<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>La serpiente y el serrucho</title>
<!-- Reel/Short «La serpiente y el serrucho» v2 (22/11/2026, Tomi). Motion graphics en canvas, sin el motor de partículas:
     serpiente y serrucho vectoriales con volumen (vista cenital, luz de arriba a la izquierda), cuenta de Martín con barra y
     lotes 3D, fórmula, reglas en tarjetas y cierre. ?v=ig | ?v=yt. Contrato: window.cuadro(t) determinista, window.EVENTOS,
     window.listo. Todo cambio va atado a una palabra de la voz con W(bloque, 'palabra', n). La voz no se toca. -->
<script>
  const Q = new URLSearchParams(location.search), V = Q.get('v') || 'ig';
  document.write(`<script src="${Q.get('t') || 'tiempos-' + V + '.js'}"><\/script>`);
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #071426; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ───────────────────────── paleta y utilidades ─────────────────────────
const C = { f1: '#071426', f2: '#0d2142', oro: '#e2c68c', oro2: '#c7a35e', oro3: '#8e7140', txt: '#ecf1f9', txt2: '#a3b5d1',
  verde: '#3dd68c', rojo: '#ff6b6b', borde: '#274a80', panel: '#0d2142' };
const TIT = '"Inter Display", Inter, sans-serif', SANS = 'Inter, sans-serif', MONO = '"JetBrains Mono", monospace';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const io = k => (k = cl(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const out3 = k => 1 - Math.pow(1 - cl(k), 3);
const back = k => { k = cl(k); const s = 1.5; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const ramp = (t, a, d = .35) => cl((t - a) / d);
const win = (t, a, b, d = .3) => Math.min(ramp(t, a, d), 1 - ramp(t, b, d));
const pulso = (t, a, d = .25) => { const k = (t - a) / d; return k < 0 || k > 1 ? 0 : Math.sin(Math.PI * k); };
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r);
  X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function hex(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function mezcla(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const f = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, k)); return '#' + ((1 << 24) | (f(16) << 16) | (f(8) << 8) | f(0)).toString(16).slice(1); }
function texto(s, x, y, font, color, align = 'left', a = 1) { if (a <= 0) return; const ga = X.globalAlpha; X.globalAlpha = ga * a; X.font = font; X.fillStyle = color;
  X.textAlign = align; X.textBaseline = 'middle'; X.fillText(s, x, y); X.globalAlpha = ga; }
function chip(s, x, y, color, a = 1, opt = {}) {
  if (a <= 0) return 0; X.save(); X.globalAlpha *= a; X.font = `700 ${opt.fs || 24}px ${MONO}`;
  const w = X.measureText(s).width + 40, h = (opt.fs || 24) + 26, x0 = opt.izq ? x : x - w / 2;
  X.shadowColor = 'rgba(0,0,0,.45)'; X.shadowBlur = 18; X.shadowOffsetY = 6;
  rr(x0, y - h / 2, w, h, 10); X.fillStyle = opt.relleno || 'rgba(5,14,28,.92)'; X.fill(); X.fillStyle = hex(color, .14); X.fill(); X.shadowColor = 'transparent';
  X.lineWidth = 2.5; X.strokeStyle = color; X.stroke();
  X.fillStyle = opt.tc || color; X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillText(s, x0 + 20, y + 1); X.restore(); return w; }
// título grande con entrada (sube + escala con overshoot) y salida
function titulo(partes, y, fs, k, s = 1, x = 540) {
  if (k <= 0 || s <= 0) return; X.save(); const e = back(k); X.globalAlpha *= cl(k * 1.6) * s;
  X.translate(x, y + 36 * (1 - e)); X.scale(.9 + .1 * e, .9 + .1 * e); X.font = `900 ${fs}px ${TIT}`;
  const ws = partes.map(p => X.measureText(p[0]).width), tot = ws.reduce((a, b) => a + b, 0); let xx = -tot / 2;
  X.textBaseline = 'middle'; X.textAlign = 'left'; X.shadowColor = 'rgba(0,0,0,.6)'; X.shadowBlur = 24; X.shadowOffsetY = 6;
  partes.forEach((p, i) => { X.fillStyle = p[1] || C.txt; X.fillText(p[0], xx, 0); xx += ws[i]; }); X.restore(); }

// ───────────────────────── tiempos de la voz ─────────────────────────
const T = window.T, B = {}; T.bloques.forEach(b => B[b.id] = b);
const norm = s => s.toLowerCase().replace(/[¿?¡!.,:;«»"()]/g, '').trim();
function W(id, frase, n = 0, fin = false) {
  const b = B[id], ws = frase.split(' ').map(norm), P = b.palabras;
  for (let i = 0; i + ws.length <= P.length; i++) {
    if (ws.every((w, j) => norm(P[i + j][2]) === w)) { if (n-- === 0) return fin ? P[i + ws.length - 1][1] : P[i][0]; } }
  console.error('No encontré «' + frase + '» en el bloque ' + id); return b.ini; }
const ini = id => B[id].ini, fin = id => B[id].ini + B[id].dur;
function Wq(id, frases, def) { for (const f of frases) { const b = B[id], ws = f.split(' ').map(norm), P = b.palabras;
  for (let i = 0; i + ws.length <= P.length; i++) if (ws.every((w, j) => norm(P[i + j][2]) === w)) return P[i][0]; }
  console.error('Falta «' + frases.join('/') + '» en el bloque ' + id + ' (uso una posición aproximada)'); return B[id].ini + def * B[id].dur; }

// 01 (gancho A, 22/11): «Una serpiente se mató sola con un serrucho. Y muchos traders hacen lo mismo después de un stop.»
const t1 = { mato: Wq('01', ['mató'], .2), sola: Wq('01', ['sola'], .3), traders: Wq('01', ['traders'], .55),
  stop: Wq('01', ['stop'], .9) };
const t2 = { ini: ini('02') - .05, serpiente: ini('02') + .1, rozo: W('02', 'rozó'), serrucho: ini('02') + .35, corto: W('02', 'cortó'),
  apenas: W('02', 'apenas'), atacada: W('02', 'atacada'), mordio: W('02', 'mordió'), lastimo: W('02', 'lastimó'), boca: W('02', 'boca') };
const t3 = { furiosa: W('03', 'furiosa'), enrosco: W('03', 'enroscó'), aplastarlo: W('03', 'aplastarlo'), cuanto: W('03', 'cuanto'),
  apretaba: W('03', 'apretaba'), mas2: W('03', 'más', 1), cortaba: W('03', 'cortaba'), serrucho: W('03', 'serrucho'), nunca: W('03', 'nunca'),
  movio: W('03', 'movió') };
const t4 = { ini: ini('04') - .1, toca: Wq('04', ['toca', 'stop'], .3), stop: Wq('04', ['stop'], .35), supongamos: W('04', 'supongamos'), martin: W('04', 'martín'),
  pierde: W('04', 'pierde'), uno: W('04', 'uno'), parte: W('04', 'parte') };
const t5 = { enoja: W('05', 'enoja'), triple: W('05', 'triple'), tamano: W('05', 'tamaño'), pierde: W('05', 'pierde'), tres: W('05', 'tres'),
  doble: W('05', 'doble'), anterior: W('05', 'anterior'), pierde2: W('05', 'pierde', 1), seis: W('05', 'seis') };
const t6 = { ini: ini('06'), hora: W('06', 'hora'), uno: W('06', 'uno'), volvio: W('06', 'volvió'), diez: W('06', 'diez'), stop: W('06', 'stop'),
  corte: W('06', 'corte'), resto: W('06', 'resto'), operar: W('06', 'operar'), revancha: W('06', 'revancha') };
const t7 = { ini: ini('07') - .1, reglas: W('07', 'reglas'), uno: W('07', 'uno'), cinco: W('07', 'cinco'), pantalla: W('07', 'pantalla'),
  dos: W('07', 'dos'), agranda: W('07', 'agranda'), recuperar: W('07', 'recuperar'), tres: W('07', 'tres', 1), dos2: W('07', 'dos', 1),
  seguidas: W('07', 'seguidas'), cierra: W('07', 'cierra'), dia: W('07', 'día') };
const t8 = { ini: ini('08') - .25, proximo: W('08', 'próximo'), sangre: W('08', 'sangre'), este: W('08', 'este'), servir: W('08', 'servir'),
  cta: V === 'ig' ? W('08', 'comentá') : W('08', 'suscribite'), boton: V === 'ig' ? W('08', 'serrucho') : W('08', 'club') };
// cortes de escena
const T_MUERE = W('03', 'cortaba', 0, true) + .12;   // la serpiente muere: queda quieta, pierde el color y cierra los ojos
const S_FAB = t2.ini, S_MAR = t4.ini, S_REG = t7.ini, S_CIE = t8.ini;

// ───────────────────────── eventos de sonido ─────────────────────────
const EV = []; const ev = (t, s) => { if (t >= 0 && t < T.total) EV.push({ t: +t.toFixed(3), s }); };
ev(t1.mato, 'impacto'); ev(t1.traders, 'whoosh'); ev(t1.stop, 'impacto');
ev(S_FAB - .1, 'cinta'); ev(S_FAB + .6, 'pop'); ev(t2.corto, 'cinta'); ev(t2.atacada, 'whoosh'); ev(t2.mordio + .12, 'impacto');
ev(t2.lastimo, 'pop');
ev(t3.enrosco, 'whoosh'); ev(t3.aplastarlo, 'clic'); ev(t3.apretaba, 'impacto'); ev(t3.mas2, 'clic'); ev(t3.cortaba, 'pop');
ev(T_MUERE + .1, 'tics'); ev(t3.serrucho, 'ding'); ev(t3.nunca + .05, 'sello');
ev(S_MAR, 'whoosh'); ev(t4.martin, 'pop'); ev(t4.stop, 'clic'); ev(t4.uno, 'moneda');
ev(t5.enoja, 'impacto'); ev(t5.triple, 'pop'); ev(t5.tres, 'moneda'); ev(t5.doble, 'pop'); ev(t5.seis, 'impacto');
ev(t6.uno, 'pop'); ev(t6.diez, 'impacto'); ev(t6.corte, 'pop'); ev(t6.operar, 'sello');
ev(S_REG, 'whoosh'); ev(t7.uno, 'pop'); ev(t7.pantalla, 'clic'); ev(t7.dos, 'pop'); ev(t7.recuperar, 'clic'); ev(t7.tres, 'pop'); ev(t7.dia, 'clic');
ev(S_CIE, 'whoosh'); ev(t8.este, 'pop'); ev(t8.cta, 'pop'); ev(t8.boton + .1, 'clic');
EV.sort((a, b) => a.t - b.t); window.EVENTOS = EV;

// ───────────────────────── fondo ─────────────────────────
const fondo = document.createElement('canvas'); fondo.width = 1080; fondo.height = 1920;
(() => { const g = fondo.getContext('2d'); const lg = g.createLinearGradient(0, 0, 0, 1920);
  lg.addColorStop(0, C.f1); lg.addColorStop(1, C.f2); g.fillStyle = lg; g.fillRect(0, 0, 1080, 1920);
  g.strokeStyle = 'rgba(163,181,209,.05)'; g.lineWidth = 1;
  for (let x = 0; x <= 1080; x += 60) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, 1920); g.stroke(); }
  for (let y = 0; y <= 1920; y += 60) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(1080, y + .5); g.stroke(); }
  const rg = g.createRadialGradient(540, 820, 220, 540, 900, 1250); rg.addColorStop(0, 'rgba(7,20,38,0)'); rg.addColorStop(1, 'rgba(2,7,15,.7)');
  g.fillStyle = rg; g.fillRect(0, 0, 1080, 1920); })();
// polvo dorado en el aire (determinista)
const POLVO = [...Array(46)].map((_, i) => { const r = n => (Math.sin(i * 127.1 + n * 311.7) * 43758.5453) % 1; const a = Math.abs;
  return { x: a(r(1)) * 1080, y: a(r(2)) * 1920, v: 8 + a(r(3)) * 22, s: 1 + a(r(4)) * 2.4, f: a(r(5)) * 6 }; });
function polvo(t, a = 1) { X.save(); for (const p of POLVO) { const y = (p.y - p.v * t) % 1920, yy = y < 0 ? y + 1920 : y;
  X.globalAlpha = a * (.18 + .18 * Math.sin(t * 1.3 + p.f)); X.fillStyle = C.oro; X.beginPath(); X.arc(p.x + 14 * Math.sin(t * .4 + p.f), yy, p.s, 0, 7); X.fill(); }
  X.restore(); }

// ═════════════════════════ FÁBULA: serrucho y serpiente ═════════════════════════
// Coordenadas locales del serrucho (vista cenital, apoyado en el piso); centro en el mundo (SX, SY).
const SX = 540, SY = 880;
const topE = x => -36 + (cl(x, -330, 190) + 330) / 520 * -60;   // lomo de la hoja (recto, más ancho hacia el mango)
const BOT = 34, DIENTE = 15;                                       // filo con dientes hacia abajo
function hojaPath(g) { g.beginPath(); g.moveTo(-322, -36); g.quadraticCurveTo(-332, -35, -332, -26); g.lineTo(-332, BOT); g.lineTo(196, BOT);
  g.lineTo(196, -97); g.lineTo(-322, -36); g.closePath(); }
function dientesPath(g) { for (let x = -330; x < 186; x += 12) { g.moveTo(x, BOT - 1); g.lineTo(x + 12, BOT - 1); g.lineTo(x + 2.5, BOT + DIENTE); g.closePath(); } }
function mangoPath(g) {
  g.beginPath(); g.moveTo(170, -104); g.bezierCurveTo(196, -132, 262, -150, 312, -128); g.bezierCurveTo(352, -110, 360, -70, 346, -30);
  g.bezierCurveTo(334, 6, 342, 52, 330, 84); g.bezierCurveTo(318, 112, 268, 116, 236, 100); g.bezierCurveTo(206, 86, 186, 66, 172, 44);
  g.closePath();
  // agujero para la mano (contorno inverso)
  g.moveTo(222, -78); g.bezierCurveTo(246, -100, 300, -96, 304, -62); g.bezierCurveTo(308, -20, 300, 36, 282, 56);
  g.bezierCurveTo(262, 76, 232, 64, 230, 30); g.bezierCurveTo(228, -8, 206, -52, 222, -78); g.closePath(); }
// pinta el serrucho entero. brillo: 0..1 barrido de luz; quieto: marco punteado «0 mm»
function serrucho(t, brilloK = -1, sombra = 1) {
  const g = X;
  // sombra proyectada en el piso
  g.save(); g.globalAlpha *= .55 * sombra; g.filter = 'blur(10px)'; g.translate(16, 24); g.fillStyle = '#000';
  hojaPath(g); g.fill(); g.beginPath(); dientesPath(g); g.fill(); mangoPath(g); g.fill('evenodd'); g.restore();
  // hoja metálica
  g.save(); hojaPath(g); g.clip();
  const lg = g.createLinearGradient(0, -100, 0, 40); lg.addColorStop(0, '#f4f7fb'); lg.addColorStop(.18, '#b9c3d0'); lg.addColorStop(.45, '#e3e9f0');
  lg.addColorStop(.7, '#8592a5'); lg.addColorStop(.86, '#aeb9c8'); lg.addColorStop(1, '#6f7c8f'); g.fillStyle = lg; g.fillRect(-340, -110, 560, 160);
  // reflejo diagonal fijo (cielo de estudio)
  const rg = g.createLinearGradient(-200, -90, 40, 40); rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(.45, 'rgba(255,255,255,.0)');
  rg.addColorStop(.5, 'rgba(255,255,255,.35)'); rg.addColorStop(.56, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(-340, -110, 560, 160);
  // cepillado
  g.globalAlpha = .1; g.strokeStyle = '#fff'; g.lineWidth = 1;
  for (let i = 0; i < 16; i++) { const y = -90 + i * 8 + (i % 3) * 1.5; g.beginPath(); g.moveTo(-340, y + 8); g.lineTo(200, y - 6); g.stroke(); }
  g.globalAlpha = 1;
  // banda del filo (triscado) más oscura
  const fg = g.createLinearGradient(0, BOT - 14, 0, BOT); fg.addColorStop(0, 'rgba(40,50,65,0)'); fg.addColorStop(1, 'rgba(40,50,65,.45)');
  g.fillStyle = fg; g.fillRect(-340, BOT - 14, 560, 14);
  // barrido de luz («nunca se movió»)
  if (brilloK >= 0 && brilloK <= 1) { const x = lerp(-520, 360, brilloK); const sg = g.createLinearGradient(x - 90, 0, x + 90, 0);
    sg.addColorStop(0, 'rgba(255,248,225,0)'); sg.addColorStop(.5, 'rgba(255,248,225,.95)'); sg.addColorStop(1, 'rgba(255,248,225,0)');
    g.globalCompositeOperation = 'lighter'; g.fillStyle = sg; g.save(); g.transform(1, 0, -.5, 1, 0, 0); g.fillRect(x - 90, -120, 180, 180); g.restore();
    g.globalCompositeOperation = 'source-over'; }
  g.restore();
  // agujero para colgar
  g.save(); g.fillStyle = '#081a33'; g.beginPath(); g.arc(-296, -10, 9, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.5; g.stroke(); g.restore();
  // dientes
  g.save(); g.beginPath(); dientesPath(g); const dg = g.createLinearGradient(0, BOT, 0, BOT + DIENTE); dg.addColorStop(0, '#9aa6b6'); dg.addColorStop(1, '#e8eef5');
  g.fillStyle = dg; g.fill(); g.strokeStyle = 'rgba(30,40,55,.55)'; g.lineWidth = 1; g.stroke(); g.restore();
  // contorno de la hoja y lomo con luz
  g.save(); hojaPath(g); g.strokeStyle = 'rgba(25,35,50,.6)'; g.lineWidth = 2; g.stroke();
  g.beginPath(); g.moveTo(-322, -35); g.lineTo(194, -95); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2.5; g.stroke(); g.restore();
  // mango de madera
  g.save(); mangoPath(g); g.clip('evenodd');
  const wg = g.createLinearGradient(170, -150, 350, 110); wg.addColorStop(0, '#b97a3e'); wg.addColorStop(.45, '#8a5426'); wg.addColorStop(1, '#5a3315');
  g.fillStyle = wg; g.fillRect(160, -160, 210, 290);
  g.strokeStyle = 'rgba(50,25,8,.35)'; g.lineWidth = 1.6;
  for (let i = 0; i < 13; i++) { g.beginPath(); const y0 = -150 + i * 22; g.moveTo(160, y0); g.bezierCurveTo(220, y0 + 18 + (i % 4) * 6, 280, y0 - 14, 380, y0 + 10); g.stroke(); }
  g.restore();
  g.save(); mangoPath(g); g.strokeStyle = '#3a1f0a'; g.lineWidth = 3; g.stroke();
  // bisel: luz arriba a la izquierda
  g.beginPath(); g.moveTo(178, -102); g.bezierCurveTo(200, -126, 262, -142, 308, -122); g.strokeStyle = 'rgba(255,220,170,.55)'; g.lineWidth = 3; g.stroke();
  g.beginPath(); g.moveTo(226, -74); g.bezierCurveTo(248, -92, 294, -90, 298, -60); g.strokeStyle = 'rgba(20,8,0,.6)'; g.lineWidth = 4; g.stroke();
  g.restore();
  // tornillos de bronce
  for (const [x, y] of [[190, -70], [190, 14], [322, -32]]) { g.save(); const bg = g.createRadialGradient(x - 3, y - 3, 1, x, y, 10);
    bg.addColorStop(0, '#fff1c4'); bg.addColorStop(.5, C.oro2); bg.addColorStop(1, '#6a4f22'); g.fillStyle = bg; g.beginPath(); g.arc(x, y, 9.5, 0, 7); g.fill();
    g.strokeStyle = 'rgba(40,25,5,.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x - 6, y + 2); g.lineTo(x + 6, y - 2); g.stroke(); g.restore(); }
}

// ── camino de la serpiente (fase 02): base Bézier + onda lateral; el cuerpo sigue el camino (locomoción serpentina)
const BZ = [[-700, 900], [-470, 320], [-400, 88], [460, 88]];
function bz(u) { const [a, b, c, d] = BZ, m = 1 - u; return [m * m * m * a[0] + 3 * m * m * u * b[0] + 3 * m * u * u * c[0] + u * u * u * d[0],
  m * m * m * a[1] + 3 * m * m * u * b[1] + 3 * m * u * u * c[1] + u * u * u * d[1]]; }
const BL = []; (() => { let acc = 0, p = bz(0); BL.push([0, 0, p]); for (let i = 1; i <= 600; i++) { const q = bz(i / 600); acc += Math.hypot(q[0] - p[0], q[1] - p[1]); BL.push([i / 600, acc, q]); p = q; } })();
const LBASE = BL[BL.length - 1][1];
function base(s) {   // punto y tangente de la base por longitud de arco (se extiende en recta antes del inicio)
  if (s <= 0) { const p0 = BL[0][2], p1 = BL[3][2], d = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), tx = (p1[0] - p0[0]) / d, ty = (p1[1] - p0[1]) / d;
    return [p0[0] + tx * s, p0[1] + ty * s, tx, ty]; }
  let lo = 0, hi = BL.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BL[m][1] < s) lo = m; else hi = m; }
  const a = BL[lo], b = BL[hi], k = cl((s - a[1]) / (b[1] - a[1] || 1)), x = lerp(a[2][0], b[2][0], k), y = lerp(a[2][1], b[2][1], k);
  const d = Math.hypot(b[2][0] - a[2][0], b[2][1] - a[2][1]) || 1; return [x, y, (b[2][0] - a[2][0]) / d, (b[2][1] - a[2][1]) / d]; }
const ONDA = 230, AMP = 30;
function camino(s) { const [x, y, tx, ty] = base(s); const a = AMP * Math.sin(2 * Math.PI * s / ONDA); return [x - ty * a, y + tx * a]; }
// cabeza: dónde está (longitud de arco) en cada momento de la fase 02
const LS = 880, N = 120;                         // largo del cuerpo y muestras
