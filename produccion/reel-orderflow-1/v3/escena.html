<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Lección 1 · Flujo de órdenes</title>
<!-- Reel/Short «Lección 1 de flujo de órdenes» v3: libro de órdenes con barras 3D en 4 pasos + caso real de BTC-USD.
     ?v=ig | ?v=yt. Contrato: window.cuadro(t) determinista, window.EVENTOS [{t,s}], window.listo. Todo cambio va atado
     a una palabra de la voz (W(bloque, palabra, n)), así que sirve con los tiempos provisorios o con los reales. -->
<script>
  const Q = new URLSearchParams(location.search), V = Q.get('v') || 'ig';
  document.write(`<script src="tiempos-${V}.js"><\/script><script src="velas.js"><\/script>`);
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #071426; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ───────────────────────── paleta y utilidades ─────────────────────────
const C = { f1: '#071426', f2: '#0d2142', oro: '#e2c68c', oro2: '#c7a35e', oro3: '#8e7140', txt: '#ecf1f9', txt2: '#a3b5d1',
  verde: '#3dd68c', rojo: '#ff6b6b', borde: '#274a80', panel: '#0d2142' };
const TIT = '"Inter Display", Inter, sans-serif', SANS = 'Inter, sans-serif', MONO = '"JetBrains Mono", monospace';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const io = k => (k = cl(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const out3 = k => 1 - Math.pow(1 - cl(k), 3);
const back = k => { k = cl(k); const s = 1.4; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const ramp = (t, a, d = .35) => cl((t - a) / d);           // 0→1 desde a en d segundos
const win = (t, a, b, d = .3) => Math.min(ramp(t, a, d), 1 - ramp(t, b, d)); // entra en a, sale en b
const fmt = n => Math.round(n).toLocaleString('es-AR').replace(/,/g, '.');
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r);
  X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function hex(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function mezcla(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const f = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, k)); return `rgb(${f(16)},${f(8)},${f(0)})`; }

// ───────────────────────── tiempos de la voz ─────────────────────────
const T = window.T, B = {}; T.bloques.forEach(b => B[b.id] = b);
const norm = s => s.toLowerCase().replace(/[¿?¡!.,:;«»"()]/g, '').trim();
// W(bloque, 'palabra' o 'dos palabras', n-ésima aparición) → segundo en que empieza. Si no está, avisa y usa el inicio del bloque.
function W(id, frase, n = 0, fin = false) {
  const b = B[id], ws = frase.split(' ').map(norm), P = b.palabras;
  for (let i = 0; i + ws.length <= P.length; i++) {
    if (ws.every((w, j) => norm(P[i + j][2]) === w)) { if (n-- === 0) return fin ? P[i + ws.length - 1][1] : P[i][0]; }
  }
  console.warn('No encontré «' + frase + '» en el bloque ' + id); return b.ini;
}
const ini = id => B[id].ini, fin = id => B[id].ini + B[id].dur;

// ───────────────────────── libro de órdenes (ejemplo) ─────────────────────────
const AX = 270, ROW0 = 446, RH = 66, U = 14;              // eje, centro de la fila 0, alto de fila, px por unidad
const NR = 11, PRECIO0 = 100050, PASO = 10;               // fila r → precio 100.050 − 10·r
const rowY = r => ROW0 + r * RH;
const precio = r => PRECIO0 - PASO * r;
const ASK = r => r <= 5;                                  // filas 0-5 venden (rojo), 6-10 compran (verde)
const Q0 = [10, 13, 8, 11, 14, 12, 9, 12, 8, 13, 10];

// eventos de estado: cantidades y precio
const evQ = [], evP = [], balas = [];
function pega(tArr, r, to) { balas.push({ t: tArr, r }); evQ.push({ t: tArr, r, to }); }
function fijaQ(t, r, to, d = .3) { evQ.push({ t, r, to, d }); }
function fijaP(t, to) { evP.push({ t, to }); }

// ─── línea de tiempo (todo atado a palabras) ───
const t01 = { op: W('01', 'operaste'), aca: W('01', 'acá'), sube: W('01', 'sube'), acaban: W('01', 'acaban'), venden: W('01', 'venden'),
  cuatro: W('01', 'cuatro') };
pega(Math.max(.42, t01.op), 5, 9); pega(t01.aca, 5, 6); pega(t01.sube, 5, 3); pega(t01.acaban, 5, 0);
pega(t01.venden, 4, 13); fijaP(t01.venden, 4);
// rebobinar en «Cuatro pasos»
const REB = t01.cuatro;
Q0.forEach((q, r) => fijaQ(REB, r, q, .55)); fijaP(REB, 5);

const t02 = { paso: W('02', 'paso'), pasivas: W('02', 'pasivas'), cada: W('02', 'cada'), arriba: W('02', 'arriba'),
  abajo: W('02', 'abajo'), compran: W('02', 'compran', 0, true) };
const t03 = { paso: W('03', 'paso'), agresivas: W('03', 'agresivas'), comprar: W('03', 'comprar'), lleva: W('03', 'lleva'),
  venta: W('03', 'venta'), barato: W('03', 'barato') };
pega(t03.lleva + .1, 5, 9); pega(t03.barato, 5, 7);
const t04 = { paso: W('04', 'paso'), queda: W('04', 'queda'), nadie: W('04', 'nadie'), venda: W('04', 'venda'),
  proximo: W('04', 'próximo'), paga: W('04', 'paga'), escalon: W('04', 'escalón'), asi: W('04', 'así'), sube: W('04', 'sube'),
  vela: W('04', 'vela') };
pega(t04.queda, 5, 4); pega(t04.venda, 5, 0); pega(t04.paga, 4, 13); fijaP(t04.escalon, 4);
const t05 = { paso: W('05', 'paso'), siguen: W('05', 'siguen'), comprando: W('05', 'comprando'), precio: W('05', 'precio'),
  no: W('05', 'no sube'), vendedor: W('05', 'vendedor'), vuelve: W('05', 'vuelve'), llenar: W('05', 'llenar'),
  roja: W('05', 'roja'), absorcion: W('05', 'absorción') };
fijaQ(t05.paso + .25, 4, 34, .7);
pega(t05.siguen, 4, 30); pega(t05.comprando, 4, 26); pega(t05.precio, 4, 22); pega(t05.no + .15, 4, 19);
fijaQ(t05.llenar, 4, 34, .6);
evQ.sort((a, b) => a.t - b.t); evP.sort((a, b) => a.t - b.t); balas.sort((a, b) => a.t - b.t);

function cantidad(r, t) {           // cantidad visible (animada) de la fila r
  let v = Q0[r], prev = Q0[r], t0 = -9, d = .3;
  for (const e of evQ) { if (e.r !== r) continue; if (e.t > t) break; prev = lerp(prev, v, out3((e.t - t0) / d)); v = e.to; t0 = e.t; d = e.d || .28; }
  return lerp(prev, v, out3((t - t0) / d));
}
function cantidadEntera(r, t) { let v = Q0[r]; for (const e of evQ) { if (e.r !== r) continue; if (e.t > t) break; v = e.to; } return v; }
function filaPrecio(t) {
  let v = 5, prev = 5, t0 = -9;
  for (const e of evP) { if (e.t > t) break; prev = lerp(prev, v, back((e.t - t0) / .45)); v = e.to; t0 = e.t; }
  let r = lerp(prev, v, back((t - t0) / .45));
  // «el precio no sube»: intento de subir y vuelve
  const k = (t - (t05.no + .1)) / .7; if (k > 0 && k < 1) r -= .28 * Math.sin(Math.PI * k);
  return r;
}

const t06 = { paso: ini('06'), bitcoin: W('06', 'bitcoin'), venia: W('06', 'venía'), subiendo: W('06', 'subiendo'),
  quince: W('06', 'quince'), casi: W('06', 'casi'), normal: W('06', 'normal'), logico: W('06', 'lógico'),
  casi2: W('06', 'casi', 1), movio: W('06', 'movió') };
const t07 = { una: ini('07'), despues: W('07', 'después'), dos: W('07', 'dos'), abajo: W('07', 'abajo'), ojo: W('07', 'ojo'),
  caso: W('07', 'caso') };
const t08 = { ini: ini('08'), leccion: W('08', 'lección'), uno: W('08', 'uno'), dos: W('08', 'dos'),
  cta: V === 'ig' ? W('08', 'comentá') : W('08', 'suscribite'), boton: V === 'ig' ? W('08', 'aviso') : W('08', 'ver') };
const T_CASO = t06.paso - .15, T_CIERRE = t08.ini - .1;

// ───────────────────────── eventos de sonido ─────────────────────────
const EV = [];
const ev = (t, s) => { if (t >= 0 && t < T.total) EV.push({ t: +t.toFixed(3), s }); };
balas.forEach(b => ev(b.t, 'tic'));
ev(t01.venden, 'sube'); ev(REB, 'whoosh');
[t02.paso, t03.paso, t04.paso, t05.paso].forEach(t => ev(t, 'clic'));
ev(t02.pasivas, 'pop'); ev(t02.cada, 'pop'); ev(t03.agresivas, 'pop'); ev(t03.barato, 'pop');
ev(t04.venda, 'pop'); ev(t04.escalon, 'sube'); ev(t04.vela, 'pop');
ev(t05.paso + .25, 'whoosh'); ev(t05.vendedor, 'pop'); ev(t05.llenar, 'clic'); ev(t05.absorcion, 'impacto');
ev(T_CASO, 'whoosh'); ev(t06.quince, 'pop'); ev(t06.casi, 'pop'); ev(t06.logico, 'pop'); ev(t06.casi2, 'cinta');
ev(t07.dos, 'impacto'); ev(t07.caso, 'sello');
ev(T_CIERRE, 'whoosh'); ev(t08.cta, 'pop'); ev(t08.boton + .1, 'clic');
EV.sort((a, b) => a.t - b.t); window.EVENTOS = EV;

// ───────────────────────── fondo ─────────────────────────
const fondo = document.createElement('canvas'); fondo.width = 1080; fondo.height = 1920;
(() => { const g = fondo.getContext('2d'); const lg = g.createLinearGradient(0, 0, 0, 1920);
  lg.addColorStop(0, C.f1); lg.addColorStop(1, C.f2); g.fillStyle = lg; g.fillRect(0, 0, 1080, 1920);
  g.strokeStyle = 'rgba(163,181,209,.055)'; g.lineWidth = 1;
  for (let x = 0; x <= 1080; x += 60) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, 1920); g.stroke(); }
  for (let y = 0; y <= 1920; y += 60) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(1080, y + .5); g.stroke(); }
  const rg = g.createRadialGradient(540, 760, 200, 540, 900, 1250); rg.addColorStop(0, 'rgba(7,20,38,0)'); rg.addColorStop(1, 'rgba(3,9,18,.6)');
  g.fillStyle = rg; g.fillRect(0, 0, 1080, 1920); })();

// ───────────────────────── piezas de dibujo ─────────────────────────
function texto(s, x, y, font, color, align = 'left', a = 1) { const ga = X.globalAlpha; X.globalAlpha = ga * a; X.font = font; X.fillStyle = color; X.textAlign = align;
  X.textBaseline = 'middle'; X.fillText(s, x, y); X.globalAlpha = ga; }
function chip(s, x, y, color, a = 1, opt = {}) {   // chip en mono mayúsculas; x = centro salvo opt.izq
  if (a <= 0) return 0; X.save(); X.globalAlpha *= a; X.font = `700 ${opt.fs || 24}px ${MONO}`;
  const w = X.measureText(s).width + 40, h = (opt.fs || 24) + 26, x0 = opt.izq ? x : x - w / 2;
  X.shadowColor = 'rgba(0,0,0,.45)'; X.shadowBlur = 18; X.shadowOffsetY = 6;
  rr(x0, y - h / 2, w, h, 10); X.fillStyle = opt.relleno || hex(color, .16); X.fill(); X.shadowColor = 'transparent';
  X.lineWidth = 2.5; X.strokeStyle = color; X.stroke();
  X.fillStyle = opt.tc || color; X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillText(s, x0 + 20, y + 1); X.restore(); return w; }
function prisma(x, y, w, h, col, a = 1, brillo = 0) {   // barra horizontal 3D con sombra proyectada
  if (w < 1) return; X.save(); X.globalAlpha *= a; const d = 9;
  X.fillStyle = 'rgba(0,4,12,.42)'; X.beginPath();    // sombra proyectada abajo a la derecha
  X.moveTo(x + 6, y + h); X.lineTo(x + w + 6, y + h); X.lineTo(x + w + 18, y + h + 14); X.lineTo(x + 18, y + h + 14); X.closePath(); X.fill();
  X.fillRect(x + w, y - d + 6, 14, h + 8);
  X.fillStyle = mezcla(col, '#ffffff', .38); X.beginPath();   // cara de arriba
  X.moveTo(x, y); X.lineTo(x + w, y); X.lineTo(x + w + d, y - d); X.lineTo(x + d, y - d); X.closePath(); X.fill();
  X.fillStyle = mezcla(col, '#000000', .35); X.beginPath();   // cara del extremo
  X.moveTo(x + w, y); X.lineTo(x + w + d, y - d); X.lineTo(x + w + d, y + h - d); X.lineTo(x + w, y + h); X.closePath(); X.fill();
  const lg = X.createLinearGradient(0, y, 0, y + h); lg.addColorStop(0, mezcla(col, '#ffffff', .1)); lg.addColorStop(1, mezcla(col, '#000000', .12));
  X.fillStyle = lg; X.fillRect(x, y, w, h);
  if (brillo > 0) { X.globalAlpha *= brillo; X.shadowColor = C.oro; X.shadowBlur = 40; X.strokeStyle = C.oro; X.lineWidth = 4;
    X.strokeRect(x - 2, y - 2, w + 4, h + 4); }
  X.restore(); }

// velas del ejemplo (precio en unidades de 100.000): las anteriores y la viva
const VEX = [[99962, 99978, 99958, 99974], [99974, 99980, 99964, 99968], [99968, 99990, 99966, 99986], [99986, 100000, 99982, 99996]];
const CX0 = 772, CDX = 36, CW = 22;
function yPrecio(p) { return rowY((PRECIO0 - p) / PASO); }
function vela(x, o, h, l, c, w, a = 1, borde = 0) {
  const sube = c >= o, col = sube ? C.verde : C.rojo, yo = yPrecio(o), yc = yPrecio(c);
  X.save(); X.globalAlpha *= a; X.strokeStyle = col; X.lineWidth = 3; X.beginPath(); X.moveTo(x, yPrecio(h)); X.lineTo(x, yPrecio(l)); X.stroke();
  X.fillStyle = 'rgba(0,4,12,.4)'; X.fillRect(x - w / 2 + 6, Math.min(yo, yc) + 8, w, Math.max(4, Math.abs(yc - yo)));
  X.fillStyle = col; X.fillRect(x - w / 2, Math.min(yo, yc), w, Math.max(4, Math.abs(yc - yo)));
  if (borde > 0) { X.globalAlpha *= borde; X.strokeStyle = C.oro; X.lineWidth = 4; X.shadowColor = C.oro; X.shadowBlur = 24;
    X.strokeRect(x - w / 2 - 9, Math.min(yo, yc, yPrecio(h)) - 9, w + 18, Math.abs(yPrecio(l) - Math.min(yo, yc, yPrecio(h))) + 18); }
  X.restore(); }

// ───────────────────────── pestañas ─────────────────────────
const TABS = ['1 PASIVAS', '2 AGRESIVAS', '3 UN ESCALÓN ARRIBA', '4 TRABADO'];
const TAB_T = [t02.paso, t03.paso, t04.paso, t05.paso];
function pestanas(t, a) {
  if (a <= 0) return; X.save(); X.globalAlpha = a; X.font = `700 23px ${MONO}`;
  const ws = TABS.map(s => X.measureText(s).width), gap = (800 - ws.reduce((p, q) => p + q, 0)) / 3;
  let x = 140; const act = TAB_T.reduce((p, q, i) => t >= q - .05 ? i : p, -1);
  TABS.forEach((s, i) => {
    // en «Cuatro pasos» se presentan una por una
    const pres = ramp(t, t01.cuatro + .25 + i * .22, .18) * (1 - ramp(t, t01.cuatro + 1.3 + i * .05, .35));
    const on = (t < T_CASO && i === act) ? 1 : 0;
    const k = Math.max(on, pres);
    X.fillStyle = k > 0 ? mezcla('#4a5f80', C.oro, k) : '#4a5f80'; X.fillRect(x, 262, ws[i], k > 0 ? 3 + 2 * k : 3);
    X.fillStyle = k > 0 ? mezcla('#6d7f9c', C.oro, k) : '#6d7f9c'; X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillText(s, x, 300);
    x += ws[i] + gap; });
  X.restore(); }

// ───────────────────────── leyendas (zona y 1110-1420) ─────────────────────────
function leyenda(t) {
  const L = [];   // cada una: [a, b, dibujo(k)]
  const add = (a, b, f) => L.push([a, b, f]);
  const linea = (chipTxt, col, frase, k, y = 1222) => { const e = back(k); X.save(); X.translate(540, y + 40 * (1 - e)); X.globalAlpha *= cl(k * 1.4);
    chip(chipTxt, 0, 0, col, 1, { fs: 28 }); texto(frase, 0, 92, `600 50px ${SANS}`, C.txt, 'center'); X.restore(); };
  const grande = (s, col, k, y = 1290, fs = 104) => { X.save(); const e = back(k); X.translate(540, y); X.scale(.85 + .15 * e, .85 + .15 * e);
    X.globalAlpha *= cl(k * 1.5); X.shadowColor = hex(col, .45); X.shadowBlur = 40; texto(s, 0, 0, `900 ${fs}px ${TIT}`, col, 'center'); X.restore(); };
  // gancho
  add(-1, t01.cuatro, k => { grande('¿POR QUÉ', C.txt, 1, 1236, 96); grande('SUBE EL PRECIO?', C.oro, 1, 1340, 96); });
  add(t01.cuatro, t02.pasivas, k => grande('4 PASOS', C.oro, k));
  add(t02.pasivas, t03.agresivas, k => linea('PASIVAS', C.txt2, 'las limitadas esperan', k));
  add(t03.agresivas, t04.nadie, k => linea('AGRESIVAS', C.verde, 'las órdenes a mercado toman', k));
  add(t04.nadie, t04.escalon, k => linea('A ESTE PRECIO', C.rojo, 'no queda nadie que venda', k));
  add(t04.escalon, t04.vela, k => grande('+1 ESCALÓN', C.oro, k));
  add(t04.vela, t05.paso, k => linea('ASÍ SUBE', C.verde, 'y se arma la vela verde', k));
  add(t05.siguen, t05.vendedor, k => linea('SIGUEN COMPRANDO', C.verde, 'y el precio no sube', k));
  add(t05.vendedor, t05.absorcion, k => linea('VENDEDOR GRANDE', C.rojo, 'vuelve a llenar la barra', k));
  add(t05.absorcion, T_CASO, k => grande('ABSORCIÓN', C.oro, k, 1290, 124));
  return L; }
let LEY = null;

// ───────────────────────── escena del libro ─────────────────────────
function libro(t, a, dx) {
  if (a <= 0) return; X.save(); X.globalAlpha = a; X.translate(dx, 0);
  // cámara: se acerca suave a la zona del precio durante los pasos
  const z = 1 + .035 * io(ramp(t, t02.paso, 3)) - .035 * io(ramp(t, T_CASO - .6, .6));
  X.translate(520, 760); X.scale(z, z); X.translate(-520, -760);
  const pr = filaPrecio(t), prEnt = Math.round(pr);
  // atenuar: arriba / abajo según la voz (bloque 02)
  const enAsk = win(t, t02.arriba, t02.abajo, .25), enBid = win(t, t02.abajo, t02.compran + .4, .25);
  // escala de precios y eje
  texto('PRECIO · EJEMPLO', 160, 372, `700 19px ${MONO}`, C.txt2, 'left', .75);
  for (let r = 0; r < NR; r++) { if (Math.abs(r - pr) < .5) continue; texto(fmt(precio(r)), 254, rowY(r), `600 25px ${MONO}`, C.txt2, 'right', .85); }
  X.fillStyle = '#c9d6ea'; X.fillRect(AX - 4, ROW0 - 40, 6, RH * (NR - 1) + 80);
  // velas del ejemplo (a la derecha y abajo)
  VEX.forEach((v, i) => vela(CX0 + i * CDX, v[0], v[1], v[2], v[3], CW, .95));
  const pV = precio(pr), cierre = Math.max(99996, pV);
  const bordeVela = win(t, t04.vela, t05.paso, .3);
  vela(CX0 + 4 * CDX, 99996, Math.max(cierre, 99996 + 1), 99993, cierre, CW, 1, bordeVela);
  { const yL = rowY(pr); X.save(); X.strokeStyle = hex(C.txt, .55); X.lineWidth = 2; X.setLineDash([10, 8]); X.beginPath(); X.moveTo(AX, yL); X.lineTo(935, yL); X.stroke(); X.restore(); }
  // barras
  for (let r = 0; r < NR; r++) {
    const q = cantidad(r, t), w = q * U, ask = ASK(r), col = ask ? C.rojo : C.verde;
    let al = 1; if (enAsk > 0) al = lerp(1, ask ? 1 : .28, enAsk); if (enBid > 0) al = lerp(al, ask ? .28 : 1, enBid);
    if (ask && r > prEnt - 0 && r <= 5 && cantidadEntera(r, t) === 0) al *= .0;
    let brillo = 0;
    if (r === 4) brillo = Math.max(win(t, t05.llenar, t05.absorcion + 1.2, .25) * (.6 + .4 * Math.sin((t - t05.llenar) * 9)), 0);
    prisma(AX + 2, rowY(r) - 20, w, 40, col, al, brillo);
    const qe = Math.round(q);
    if (q > .4) { const golpe = balas.some(b => b.r === r && t >= b.t && t < b.t + .25);
      texto(String(qe), AX + w + 24, rowY(r) - 3, `800 ${golpe ? 34 : 29}px ${MONO}`, '#ffffff', 'left', al); }
    else if (ask && r === 5 && t > t04.venda - .05 && t < T_CASO) texto('0', AX + 22, rowY(r) - 3, `800 26px ${MONO}`, C.rojo, 'left', .9);
  }
  // recuadro de la orden limitada (paso 1)
  const kb = win(t, t02.cada, t02.arriba, .25);
  if (kb > 0) { const w = cantidad(5, t) * U; X.save(); X.globalAlpha = kb; X.strokeStyle = C.oro; X.lineWidth = 3; X.setLineDash([]);
