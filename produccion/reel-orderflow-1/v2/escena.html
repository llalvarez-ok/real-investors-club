// ---------- utilidades de tiempo ----------
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const B = id => T.bloques.find(b => b.id === id);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]/g, '');

// ---------- tiempos clave (todo atado a palabras) ----------

K.b4 = ini('04'); K.vacian = P('04', 'vacian').i; K.cien4 = P('04', 'cien').f; K.proximo = P('04', 'proximo').i; K.pagar = P('04', 'pagar').i;
K.c101 = P('04', 'ciento uno').i; K.subio = P('04', 'subio').i;
K.b5 = ini('05'); K.camion = P('05', 'camion').i; K.repone = P('05', 'repone').i; K.compran = P('05', 'compran').i;

// ---------- fondo: grano determinista ----------
const gc = document.getElementById('grano').getContext('2d'); { let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const id = gc.createImageData(600, 1100); for (let i = 0; i < id.data.length; i += 4) { const g = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = g; id.data[i + 3] = 255; } gc.putImageData(id, 0, 0); }

// ---------- 01 · gancho ----------
const gancho = $(`<div class="abs" style="left:140px;width:800px;top:560px;text-align:center">

// pila del gancho: un cajón con 6 mandarinas que se acaban

const gPila = [[0, 0], [1, 0], [2, 0], [.5, 1], [1.5, 1], [1, 2]].map(([c, r]) => ({ e: img(R + 'tangerine.svg', 104, document.getElementById('capa')), x: 540 + (c - 1) * 96, y: 960 - r * 86 }));
const tagVenta = $(`<div class="chip" style="left:540px;top:1215px">A LA VENTA</div>`);
const flechaSube = $(`<div class="abs" style="left:340px;width:400px;top:760px;text-align:center;font:900 120px/1 'Inter Display';color:var(--verde)">▲<div style="font:900 64px 'Inter Display';letter-spacing:2px">SUBE</div></div>`);

// ---------- feria ----------
const mundo = document.getElementById('mundo');
const CX = [258, 540, 822], PREC = ['$100', '$101', '$102'];
const VEND = ['woman-farmer.svg', 'man-farmer-medium-light.svg', 'farmer.svg'];
const puesto = (cx, i) => {
  const g = $(`<div class="abs" style="left:${cx - 135}px;top:560px;width:270px;height:520px"></div>`, mundo);
  // fondo: parantes y sombra del puesto
  $(`<svg class="abs" style="left:0;top:0" width="270" height="520" viewBox="0 0 270 520">

  const vend = img(R + VEND[i], 116, g); vend.style.left = '128px'; vend.style.top = '210px';

    <rect x="15" y="40" width="240" height="62" fill="url(#tl${i})"/><rect x="8" y="28" width="254" height="16" rx="8" fill="#16335f"/>
    <rect x="12" y="335" width="246" height="18" rx="6" fill="#c39a5a"/>
    <rect x="18" y="350" width="234" height="160" rx="8" fill="url(#md${i})"/>
    <g stroke="#4a381f" stroke-width="3" opacity=".55"><line x1="18" y1="402" x2="252" y2="402"/><line x1="18" y1="456" x2="252" y2="456"/></g>

  const cartel = $(`<div class="cartel" style="left:135px;top:385px">$ —</div>`, g);

};
const calle = $(`<svg class="abs" style="left:0;top:548px" width="1080" height="90" viewBox="0 0 1080 90"><rect y="10" width="1080" height="70" fill="#0a1a33"/><rect y="8" width="1080" height="4" fill="#274a80"/><line x1="0" x2="1080" y1="46" y2="46" stroke="#3b5f96" stroke-width="4" stroke-dasharray="34 26"/></svg>`, mundo);
const camion = img(R + 'delivery-truck.svg', 210, mundo); camion.style.transform = 'scaleX(-1)';
const piso = $(`<div class="abs" style="left:-100px;top:1070px;width:1280px;height:260px;background:radial-gradient(640px 120px at 50% 40%, rgba(70,110,170,.22), transparent 70%);border-top:2px solid rgba(39,74,128,.55)"></div>`, mundo);
mundo.insertBefore(piso, mundo.firstChild);
const puestos = CX.map(puesto);
const chipLim = CX.map(cx => $(`<div class="chip" style="left:${cx}px;top:572px">ESPERA</div>`, mundo));
// mandarinas (6 por puesto): pirámide 3-2-1 sobre el mostrador (y del mostrador = 560+335)
const SL = [[0, 0], [1, 0], [2, 0], [.5, 1], [1.5, 1], [1, 2]];
const slotPos = (p, j) => ({ x: CX[p] - 52 + (SL[j][0] - 1) * 48, y: 895 - 26 - SL[j][1] * 42 });
const mand = CX.map((_, p) => SL.map((_, j) => img(R + 'tangerine.svg', 56, mundo)));
const vuelo = [...Array(10)].map(() => img(R + 'tangerine.svg', 50, mundo));
// compradores
const TIP = ['man-running-facing-right.svg', 'woman-running-facing-right-medium-light.svg', 'person-running-facing-right-medium-dark.svg', 'woman-running-facing-right.svg', 'man-running-facing-right-medium.svg'];
const NC = 40; const comp = [...Array(NC)].map((_, k) => img(R + TIP[k % 5], 168, mundo));

const chipMer = $(`<div class="chip">COMPRA YA</div>`, mundo);

// ---------- programa de compras y reposiciones ----------
const compras = [];  // {t, p}
{ const a = K.vacian + .05, b = Math.max(K.cien4 + .1, a + 1.6), d = (b - a) / 6; for (let j = 0; j < 6; j++) compras.push({ t: a + j * d, p: 0 }); }
const tMover = K.proximo; compras.push({ t: Math.max(K.c101 - .15, tMover + .75), p: 1 });

{ let t = Math.max(K.compran, K.repone + .6); const tf = fin('05') - .2; let n = 0; while (t < tf) { compras.push({ t, p: 1 }); repos.push({ t: t + .55, p: 1 }); t += .62; n++; } }
compras.sort((a, b) => a.t - b.t);
const ultimo100 = compras.filter(c => c.p === 0).slice(-1)[0].t;
// intervalos de cada mandarina

const vis = CX.map((_, p) => SL.map((_, j) => [[tArmado(p) + .25 + j * .06, 1e9]]));
{ const evs = [...compras.map(c => ({ ...c, k: 'c' })), ...repos.map(r => ({ ...r, k: 'r' }))].sort((a, b) => a.t - b.t); const n = [6, 6, 6];
  for (const e of evs) { if (e.k === 'c') { const j = --n[e.p]; vis[e.p][j][vis[e.p][j].length - 1][1] = e.t; } else { const j = n[e.p]++; if (j > 5) { n[e.p] = 6; continue; } vis[e.p][j].push([e.t, 1e9]); } } }
const servido = t => compras.reduce((s, c) => s + eio(pr(t, c.t + .2, .5)), 0);
const frenteX = t => lerp(CX[0] + 4, CX[1] + 4, eio(pr(t, tMover, .8)));
const CAMX = CX[1] - 105, CAMY = 425;
const camionX = t => lerp(1250, CAMX, eo(pr(t, K.camion - .75, 1.0)));

// ---------- precio ----------
const ticker = $(`<div id="ticker" class="abs"><div class="l">PRECIO<br>AHORA</div><div class="v"><div id="pa">$100</div><div id="pb" class="verde">$101</div></div><div class="f verde" id="tf">▲</div></div>`);
const pa = ticker.querySelector('#pa'), pb = ticker.querySelector('#pb'), tf = ticker.querySelector('#tf');
const noSube = $(`<div class="chip" style="left:540px;top:1290px;font-size:32px;border-color:#e2c68c;color:#071426;background:#e2c68c">= NO SUBE</div>`);

// ---------- títulos ----------
const TITS = [];
const titulo = (t0, t1, html) => { const e = $(`<div class="abs tit">${html}</div>`); TITS.push({ e, t0, t1 }); };
titulo(K.b2 + .2, K.limitada - .25, `<div class="k">EJEMPLO · UNA FERIA</div>`);
titulo(K.limitada, K.b3 + .1, `<div class="m oro">ORDEN LIMITADA</div><div class="s">Pone su precio y espera</div>`);

    l1.style.transform = `scale(${k1})`; op(l1, cl(pr(t, K.b8 + .05, .12)));
    const k2b = entra(t, K.b8 + .45, .4); l2.style.transform = `scale(${k2b})`; op(l2, cl(pr(t, K.b8 + .45, .12)));
    const tg = IG ? K.feria : K.suscribite; const kg = pr(t, tg - .05, .45);
    op(grande, cl(pr(t, tg - .05, .12))); grande.style.transform = `scale(${lerp(1.6, 1, eb(kg))})`;
    op(mandC, IG ? cl(pr(t, tg + .2, .15)) : 0); pos(mandC, 820, 560, 130, eb(pr(t, tg + .2, .45)), Math.sin(t * 2) * 10);
    const kt = eo(pr(t, K.b8 + .1, .55)); op(tarjeta, cl(pr(t, K.b8 + .1, .25))); tarjeta.style.transform = `translateY(${120 * (1 - kt)}px)`;
    // cursor que toca el botón
    const r0 = tClic - .9, kc = eio(pr(t, r0, .8)); const bx = 540, by = IG ? 840 + 410 : 860 + 330;
    op(cursor, cl(pr(t, r0, .15)) * (1 - pr(t, tClic + .9, .3)));
    const pres = Math.sin(Math.PI * pr(t, tClic - .05, .2));
    cursor.style.left = lerp(860, bx + 20, kc) + 'px'; cursor.style.top = lerp(1420, by, kc) + 'px'; cursor.style.transform = `scale(${1 - .15 * pres})`;
    const hecho = t >= tClic;
    bt.textContent = hecho ? (IG ? 'Siguiendo ✓' : 'Suscripto ✓') : (IG ? 'Seguir' : 'Suscribirme');
    bt.style.background = hecho ? '#1c2f52' : (IG ? '#3b82f6' : '#ecf1f9'); bt.style.color = hecho ? '#ecf1f9' : (IG ? '#fff' : '#0b1830');
    bt.style.transform = `scale(${1 - .05 * pres})`;
  }

  pintaSubs(t);
};

function dibujaGrafico(t) {
  const vg = ventana(t, K.b6 - .2, K.b8 - .1, .55, .4);
  op(graf, vg); op(capaG, vg); op(selloCaso, 0);
  if (vg <= 0) { graf.innerHTML = ''; return; }
  // cámara del gráfico: acerca la vela clave en «casi no se movió» y vuelve en el 07
  const fxC = gx(clave.k), fyC = gy((clave.o + clave.c) / 2);
  const z = 1 + 1.25 * eio(pr(t, K.movio - .1, .7)) * (1 - eio(pr(t, K.b7 - .2, .7)));
  const ent = 1 - eo(pr(t, K.b6 - .2, .6));
  const zk = (z - 1) / 1.25, X = x => (x - fxC) * z + fxC + (540 - fxC) * zk, Y = y => (y - fyC) * z + fyC + (840 - fyC) * zk + ent * 80;
  let h = '';
  // grilla de precios
  for (const p of [83000, 84000, 85000]) { const y = Y(gy(p)); if (y < 600 || y > 1100) continue;
    h += `<line x1="160" x2="900" y1="${y}" y2="${y}" stroke="rgba(120,150,200,.18)" stroke-width="2" stroke-dasharray="6 10"/>`;
    h += `<text x="160" y="${y - 10}" fill="#6f84a6" font-family="JetBrains Mono" font-size="22">${p.toLocaleString('es-AR')}</text>`; }
  // cuántas velas se ven
  const kVenia = pr(t, K.bitcoin, Math.max(1, K.quince - K.bitcoin - .2));          // 09:00 → 12:45
  const kDesp = pr(t, K.hora - .1, Math.max(.8, K.abajo - K.hora));               // 13:15 → 14:30
  const ancho = (GX1 - GX0) / NS * .66 * z;
  velas.forEach(vl => {
    let k;
    if (vl.k < KC) k = cl(kVenia * KC - vl.k);
    else if (vl.k === KC) k = eb(pr(t, K.quince - .05, .4));
    else k = cl(kDesp * 6 - (vl.k - KC - 1));
    if (k <= 0) return;
    const sube = vl.c >= vl.o, col = sube ? '#3dd68c' : '#ff6b6b', x = X(gx(vl.k));
    const yh = Y(gy(vl.h)), yl = Y(gy(vl.l)), yo = Y(gy(vl.o)), yc = Y(gy(vl.c));
    const ym = (yo + yc) / 2, sq = k; // crece desde el medio
    const esClave = vl.k === KC, atenua = t > K.diez && !esClave && t < K.b7 ? .35 : 1;
    if (esClave) h += `<rect x="${x - ancho * 1.6}" y="${Math.min(yh, yl) - 24}" width="${ancho * 3.2}" height="${Math.abs(yl - yh) + 48}" rx="12" fill="rgba(226,198,140,.10)" stroke="#e2c68c" stroke-width="3" opacity="${cl(pr(t, K.quince, .3))}"/>`;
    h += `<g opacity="${cl(k) * atenua}"><line x1="${x}" x2="${x}" y1="${lerp(ym, yh, sq)}" y2="${lerp(ym, yl, sq)}" stroke="${esClave ? '#e2c68c' : col}" stroke-width="${2.5 * Math.min(z, 1.6)}"/>`;
    h += `<rect x="${x - ancho / 2}" y="${lerp(ym, Math.min(yo, yc), sq)}" width="${ancho}" height="${Math.max(3, Math.abs(yc - yo) * sq)}" rx="2" fill="${esClave ? '#e2c68c' : col}"/></g>`;
  });
  // flecha «venía subiendo»
  { const k = eo(pr(t, K.venia, .7)) * (1 - pr(t, K.quince, .3));
    if (k > 0) { const x0 = X(gx(0)), y0 = Y(gy(83500)) + 40, x1 = lerp(x0, X(gx(10.5)), k), y1 = lerp(y0, Y(gy(85300)) - 30, k);
      h += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#3dd68c" stroke-width="7" stroke-linecap="round" opacity=".8"/>`;
      const a = Math.atan2(y1 - y0, x1 - x0); h += `<polygon points="${x1 + 26 * Math.cos(a)},${y1 + 26 * Math.sin(a)} ${x1 + 16 * Math.cos(a + 2.2)},${y1 + 16 * Math.sin(a + 2.2)} ${x1 + 16 * Math.cos(a - 2.2)},${y1 + 16 * Math.sin(a - 2.2)}" fill="#3dd68c" opacity=".9"/>`;
      h += `<text x="${X(gx(0))}" y="${Y(gy(85550))}" fill="#3dd68c" font-family="Inter Display" font-weight="900" font-size="44" opacity="${k}">VENÍA SUBIENDO</text>`; } }
  // techo (el camión): línea en el máximo de la vela clave
  const xk = X(gx(KC)), ykH = Y(gy(clave.h)), ykC = Y(gy(clave.c));
  { const k = eo(pr(t, K.camion6 - .1, .5)) * (1 - pr(t, K.b7 + .4, .4));
    if (k > 0) h += `<line x1="${xk - 40}" x2="${lerp(xk - 40, xk + 210, k)}" y1="${ykH}" y2="${ykH}" stroke="#e2c68c" stroke-width="5" stroke-dasharray="14 10"/>`; }
  // «lo lógico»: flecha verde punteada hacia arriba
  { const k = eo(pr(t, K.logico, .6)), kx = pr(t, K.movio, .4), fade = 1 - .7 * pr(t, K.b7, .4);
    if (k > 0) { const x0 = xk + 10, y0 = ykC - 10, x1 = x0 + 120 * k, y1 = y0 - 125 * k;
      h += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#3dd68c" stroke-width="6" stroke-dasharray="14 10" opacity="${fade}"/>`;
      h += `<polygon points="${x1 + 8},${y1 - 22} ${x1 + 16},${y1 + 10} ${x1 - 16},${y1 - 4}" fill="#3dd68c" opacity="${fade}"/>`;
      if (kx > 0) h += `<g stroke="#ecf1f9" stroke-width="7" stroke-linecap="round" opacity="${kx * fade}"><line x1="${x0 + 40}" y1="${y0 - 85}" x2="${x0 + 40 + 44 * kx}" y2="${y0 - 85 + 44 * kx}"/><line x1="${x0 + 84}" y1="${y0 - 85}" x2="${x0 + 84 - 44 * kx}" y2="${y0 - 85 + 44 * kx}"/></g>`; } }
  // 07: caída al mínimo y tiempo
  { const k = eo(pr(t, K.abajo - .1, .6));
    if (k > 0) { const xm = X(gx(KM)), ym = Y(gy(minimo.l));
      h += `<line x1="${xk + 18}" y1="${ykC}" x2="${lerp(xk + 18, xm, k)}" y2="${ykC}" stroke="rgba(236,241,249,.5)" stroke-width="3" stroke-dasharray="6 8"/>`;
      h += `<line x1="${xm}" y1="${ykC}" x2="${xm}" y2="${lerp(ykC, ym, k)}" stroke="#ff6b6b" stroke-width="6"/>`;
      h += `<polygon points="${xm},${lerp(ykC, ym, k) + 18} ${xm - 14},${lerp(ykC, ym, k) - 6} ${xm + 14},${lerp(ykC, ym, k) - 6}" fill="#ff6b6b"/>`;
      h += `<circle cx="${xm}" cy="${ym}" r="${12 * k}" fill="#ff6b6b"/><circle cx="${xm}" cy="${ym}" r="${12 + 26 * (t * 1.5 % 1)}" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="${k * (1 - t * 1.5 % 1)}"/>`; } }
  // eje de tiempo: 1 h 30
  { const k = eo(pr(t, K.hora, .6)); if (k > 0) { const y = Y(gy(PMIN)) + 30, x0 = xk, x1 = lerp(xk, X(gx(KM)), k);
    h += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="#a3b5d1" stroke-width="4"/><line x1="${x0}" x2="${x0}" y1="${y - 12}" y2="${y + 12}" stroke="#a3b5d1" stroke-width="4"/><line x1="${x1}" x2="${x1}" y1="${y - 12}" y2="${y + 12}" stroke="#a3b5d1" stroke-width="4"/>`; } }
  // marco
  const altoM = lerp(790, 700, eio(pr(t, K.b7 - .3, .5)));
  h = `<defs><clipPath id="cm"><rect x="142" y="562" width="796" height="${t < K.b7 - .3 ? 598 : altoM - 4}" rx="26"/></clipPath></defs><rect x="140" y="560" width="800" height="${altoM}" rx="28" fill="rgba(8,22,44,.55)" stroke="#274a80" stroke-width="2" opacity="${1 - ent}"/><g clip-path="url(#cm)">` + h + '</g>';
  graf.innerHTML = h;
  // etiquetas (DOM, sin escalar)
  const chipEn = (e, a, b, x, y) => { const k = entra(t, a, .4); op(e, cl(pr(t, a, .12)) * (1 - pr(t, b, .3))); e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.transform = `translate(-50%,-50%) scale(${k})`; };
  chipEn(lblQuince, K.quince, K.diez, Math.min(700, xk - 60), Y(gy(clave.h)) - 70);
  chipEn(lblLogico, K.logico, K.movio, 450, 612);
  chipEn(lblMovio, K.movio + .45, K.camion6 - .1, 520, Y(gy(clave.l)) + 120);
  chipEn(lblHora, K.hora + .3, K.abajo, 560, Y(gy(PMIN)) + 75);
  { const k = entra(t, K.abajo, .5); op(lblMin, cl(pr(t, K.abajo, .15)) * (1 - pr(t, K.b8 - .2, .3)));
    lblMin.style.left = Math.min(700, X(gx(KM)) - 170) + 'px'; lblMin.style.top = (Y(gy(minimo.l)) + 40) + 'px'; lblMin.style.transform = `translate(-50%,0) scale(${k})`; }
  { const k = entra(t, K.camion6, .5); op(camionG, cl(pr(t, K.camion6, .15)) * (1 - pr(t, K.b7 + .2, .3)));
    pos(camionG, xk + 150 - 80 * (1 - k), ykC + 10, 150, k); camionG.style.transform += ' scaleX(-1)'; }
  // volumen: lo normal vs. esta vela
  { const k = eo(pr(t, K.diez - .2, .9)), o = cl(pr(t, K.quince + .2, .3)) * (1 - pr(t, K.b7 - .2, .3));
    op(volCaja, o); vb1.style.width = (56.5 * cl(pr(t, K.quince + .3, .4))) + 'px'; vb2.style.width = (56.5 * 9.87 * k) + 'px'; op(vbt, cl(pr(t, K.diez + .4, .3))); }
  sello(selloCaso, t, K.caso, K.b8 - .15, -5, 505, 1305);
}

// ---------- listo cuando cargan las imágenes ----------
Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => document.fonts.ready).then(() => { window.cuadro(0); window._listo(true); });
}
