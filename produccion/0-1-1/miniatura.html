<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Mono:wght@600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#071426;color:#ecf1f9}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 78% 45%,#173463 0%,#0d2142 40%,#071426 80%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(91,155,216,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(91,155,216,.07) 1px,transparent 1px);background-size:48px 48px}
.logo{position:absolute;left:56px;top:44px}.logo svg{height:58px;width:auto}
.tag{position:absolute;left:56px;top:150px;font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:.18em;color:#e2c68c}
h1{position:absolute;left:52px;top:200px;width:700px;font-family:'Archivo',sans-serif;font-weight:900;font-size:112px;line-height:.98;letter-spacing:-.01em}
.oro{background:linear-gradient(180deg,#e2c68c,#c7a35e 46%,#8e7140);-webkit-background-clip:text;background-clip:text;color:transparent}
.sello{position:absolute;right:70px;top:150px;width:420px;height:420px;border-radius:50%;border:4px solid #ff6b6b;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);background:rgba(255,107,107,.08)}
.sello b{font-family:'Archivo',sans-serif;font-weight:900;font-size:120px;color:#ff6b6b;line-height:1}
.sello span{font-family:'IBM Plex Mono',monospace;font-size:30px;color:#ff8a8a;letter-spacing:.12em;margin-top:10px}
.sello s{font-family:'Archivo',sans-serif;font-weight:800;font-size:46px;color:#ecf1f9;text-decoration-color:#ff6b6b;text-decoration-thickness:6px}
.pie{position:absolute;left:56px;bottom:40px;font-family:'IBM Plex Mono',monospace;font-size:22px;color:#a3b5d1}
</style></head>
<body><div class="bg"></div><div class="grid"></div>
<div class="logo" id="logo"></div>
<div class="tag">NIVEL 0 · LECCIÓN 6</div>
<h1>¿Cuánto se puede <span class="oro">ganar</span> de verdad?</h1>
<div class="sello"><s>garantizado</s><b>10 %</b><span>SEMANAL = HUMO</span></div>
<div class="pie">realinvestors.club</div>
</body></html>
