     Metáfora central: cada vela es un partido de fútbol entre los que compran y los que venden. Sofía = camila.
     Cada escena ocupa una zona del lienzo (6 columnas en serpentina). -->

<script>
const VERDE = "#1f9d63", ROJO = "#d93a3f", ORO = "#b8913f", GRIS = "#7d8597", TINTA = "#14213d";
const BANDA_ORO = "rgba(199,163,94,.22)", BANDA_GRIS = "rgba(125,133,151,.16)", BARRA = "#9aa6bb";
const T = window.TIEMPOS, FALTAN = (window.FALTAN = []);
const ZONA = Array.from({ length: 27 }, (_, i) => Math.max(0, i - 1));
const COLS = 6, DX = 2600, DY = 1500;
const centro = (z) => { const fila = Math.floor(z / COLS); let col = z % COLS; if (fila % 2) col = COLS - 1 - col; return [col * DX, fila * DY]; };
let S = 1, B = [0, 0];
const en = (s) => { S = s; B = centro(ZONA[s]); };
const ini = (s = S) => T.escenas[s - 1].ini, fin = (s = S) => T.escenas[s - 1].ini + T.escenas[s - 1].dur;
const norm = (x) => x.toLowerCase().replace(/[^\wáéíóúüñ]/g, "");
function w(palabra, n = 1, desfase = 0) {
  const ps = T.escenas[S - 1].palabras, q = norm(palabra);
  let k = 0;
  for (const p of ps) if (p.p === q && ++k === n) return p.t + desfase;
  FALTAN.push(`${S}:${palabra}#${n}`);
  return ini() + 1;
}
const E = [];
function add(o) {
  const r = { ...o, x: B[0] + (o.x || 0), y: B[1] + (o.y || 0) };
  if (o.respira) r.respira = { hasta: o.respira.hasta || fin() };
  if (o.desde) { r.desde = [B[0] + o.desde[0], B[1] + o.desde[1]]; r.hasta = [B[0] + o.hasta[0], B[1] + o.hasta[1]]; r.x = 0; r.y = 0; }
  E.push(r);
  return r;
}
const txt = (texto, x, y, t, o = {}) => add({ tipo: "texto", texto, x, y, t, tam: 64, ancla: "middle", d: Math.min(1.4, 0.25 + texto.length * 0.045), ...o });
const img = (src, x, y, w_, t, o = {}) => add({ tipo: "img", src, x, y, w: w_, t, d: 1.2, ...o });
const trazo = (d, t, o = {}) => add({ tipo: "trazo", d, t, dur: 0.5, ...o });
const tilde = (x, y, t, s = 1) => trazo(`M${x - 22 * s} ${y} L${x - 4 * s} ${y + 20 * s} L${x + 30 * s} ${y - 26 * s}`, t, { color: VERDE, grosor: 11 * Math.sqrt(s), dur: 0.3 });
const cruz = (x, y, t, s = 24) => trazo(`M${x - s} ${y - s} L${x + s} ${y + s} M${x + s} ${y - s} L${x - s} ${y + s}`, t, { color: ROJO, grosor: 10, dur: 0.3 });
const tacha = (x1, y1, x2, y2, t) => trazo(`M${x1} ${y1} L${x2} ${y2}`, t, { color: ROJO, grosor: 12, dur: 0.3 });
const subraya = (x1, x2, y, t, color = ORO) => trazo(`M${x1} ${y} Q${(x1 + x2) / 2} ${y + 16} ${x2} ${y - 4}`, t, { color, grosor: 10, dur: 0.45 });
const caja = (x1, y1, x2, y2, t, o = {}) => trazo(`M${x1} ${y1} L${x2} ${y1} L${x2} ${y2} L${x1} ${y2} Z`, t, { grosor: 7, dur: 0.5, ...o });
const flecha = (x1, y1, x2, y2, t, color = TINTA, o = {}) => {
  const a = Math.atan2(y2 - y1, x2 - x1), k = 34;
  const p1 = [x2 - k * Math.cos(a - 0.45), y2 - k * Math.sin(a - 0.45)], p2 = [x2 - k * Math.cos(a + 0.45), y2 - k * Math.sin(a + 0.45)];
  return trazo(`M${x1} ${y1} L${x2} ${y2} M${p1[0]} ${p1[1]} L${x2} ${y2} L${p2[0]} ${p2[1]}`, t, { color, grosor: 9, dur: 0.6, ...o });
};
const banda = (x1, x2, ya, yb, t, color = BANDA_ORO, o = {}) => trazo(`M${x1} ${(ya + yb) / 2} L${x2} ${(ya + yb) / 2}`, t, { color, grosor: Math.abs(yb - ya), dur: 0.7, punta: "butt", ...o });
const titulo = (texto, o = {}) => txt(texto, 0, -400, ini() + 0.2, { tam: 78, ...o });
// leyenda de una escena dentro de una zona compartida: arriba, y se borra al terminar la escena
const nota = (texto, t, o = {}) => txt(texto, -120, -440, t, { tam: 58, color: ORO, desaparece: fin() - 0.3, ...o });
const n2 = (v) => Math.round(v).toLocaleString("es-AR");
const O = window.ORO;

// ---------- velas ----------
// una vela grande: x, y del centro de la caja, alto en px para el rango [lo, hi]; devuelve PY para anotar precios
function velaGrande([, op, h, l, c], x, lo, hi, t, o = {}) {
  const Y0 = o.y0 ?? 330, Y1 = o.y1 ?? -300, PY = (p) => Y0 + (p - lo) / (hi - lo) * (Y1 - Y0), col = o.color || (c >= op ? VERDE : ROJO);
  const ancho = o.ancho ?? 120, tm = o.tm ?? t + 0.5;
  if (!o.sinMecha) trazo(`M${x} ${PY(h)} L${x} ${PY(l)}`, tm, { color: col, grosor: o.grMecha ?? 9, dur: 0.6 });
  const y1 = PY(Math.max(op, c)), y2 = Math.max(PY(Math.min(op, c)), y1 + 6);
  banda(x - ancho / 2, x + ancho / 2, y1, y2, t, col, { dur: 0.6 });
  return PY;
}
// una serie de velas en una caja
function serie(V, x0, x1, t1, t2, o = {}) {
  const lo = o.lo ?? Math.min(...V.map((v) => v[3])), hi = o.hi ?? Math.max(...V.map((v) => v[2]));
  const Y0 = o.y0 ?? 330, Y1 = o.y1 ?? -280, n = V.length, paso = n > 1 ? (x1 - x0) / (n - 1) : 0;
  const PX = (i) => x0 + i * paso, PY = (p) => Y0 + (p - lo) / (hi - lo) * (Y1 - Y0);
  V.forEach(([, op, h, l, c], i) => {
    const t = t1 + (t2 - t1) * i / Math.max(1, n - 1), col = c >= op ? VERDE : ROJO, x = PX(i);
    trazo(`M${x} ${PY(h)} L${x} ${PY(l)}`, t, { color: col, grosor: o.grMecha ?? 4, dur: 0.14 });
    const y1 = PY(Math.max(op, c)), y2 = Math.max(PY(Math.min(op, c)), y1 + 3);
    trazo(`M${x} ${y1} L${x} ${y2}`, t + 0.05, { color: col, grosor: Math.max(6, Math.min(o.anchoMax ?? 60, paso * 0.62)), dur: 0.14, punta: "butt" });
  });
  return { PX, PY, paso };
}
const ejes = (x0, y0, x1, y1, t, o = {}) => trazo(`M${x0} ${y1} L${x0} ${y0} L${x1} ${y0}`, t, { grosor: 5, color: GRIS, dur: 0.6, ...o });
const marcador = (texto, x, y, t, o = {}) => txt(texto, x, y, t, { tam: 96, color: TINTA, efecto: "pop", ...o });

txt("?", 600, 60, w("siguientes", 1, 0), { tam: 220, color: GRIS, efecto: "pop" });
txt("los días siguientes", 600, 300, w("siguientes", 1, 0.2), { tam: 46, color: GRIS });

});

{ const lo = 4600, hi = 4930, PY = (p) => 180 + (p - lo) / (hi - lo) * -400; trazo(MINI.map((v, i) => `${i ? "L" : "M"}${-820 + i * 40} ${PY(v[4])}`).join(" "), w("línea", 1, -0.2), { color: TINTA, grosor: 7, dur: 1.0 }); }

{ const lo = 4600, hi = 4930, PY = (p) => 180 + (p - lo) / (hi - lo) * -400; MINI.forEach((v, i) => { const x = -220 + i * 40, t = w("barras", 1, 0) + i * 0.06; trazo(`M${x} ${PY(v[2])} L${x} ${PY(v[3])} M${x - 12} ${PY(v[1])} L${x} ${PY(v[1])} M${x} ${PY(v[4])} L${x + 12} ${PY(v[4])}`, t, { color: TINTA, grosor: 4, dur: 0.1 }); }); }

}
