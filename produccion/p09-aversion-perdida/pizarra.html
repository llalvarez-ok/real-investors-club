// Zona de cada escena (la 7 y la 8 comparten el gráfico)
const ZONA = [0, 0, 1, 2, 3, 4, 5, 6, 6, 7, 8, 9, 10, 11, 12, 13, 14];
const centro = (z) => { const fila = Math.floor(z / 4); let col = z % 4; if (fila % 2) col = 3 - col; return [col * 2600, fila * 1500]; };
let S = 1, B = [0, 0];
const en = (s) => { S = s; B = centro(ZONA[s]); };
const ini = (s = S) => T.escenas[s - 1].ini, fin = (s = S) => T.escenas[s - 1].ini + T.escenas[s - 1].dur;
const norm = (x) => x.toLowerCase().replace(/[^\wáéíóúüñ]/g, "");
function w(palabra, n = 1, desfase = 0) {
  const ps = T.escenas[S - 1].palabras, q = norm(palabra);
  let k = 0;
  for (const p of ps) if (p.p === q && ++k === n) return p.t + desfase;
  FALTAN.push(`${S}:${palabra}#${n}`);
  return ini() + 1;
}
const E = [];
// add: coordenadas relativas a la zona; respira hasta el final de la escena
function add(o) {
  const r = { ...o, x: B[0] + (o.x || 0), y: B[1] + (o.y || 0) };
  if (o.respira) r.respira = { hasta: fin() };
  if (o.desde) { r.desde = [B[0] + o.desde[0], B[1] + o.desde[1]]; r.hasta = [B[0] + o.hasta[0], B[1] + o.hasta[1]]; r.x = 0; r.y = 0; }
  E.push(r);
  return r;
}
const txt = (texto, x, y, t, o = {}) => add({ tipo: "texto", texto, x, y, t, tam: 64, ancla: "middle", d: Math.min(1.4, 0.25 + texto.length * 0.045), ...o });
const img = (src, x, y, w_, t, o = {}) => add({ tipo: "img", src, x, y, w: w_, t, d: 1.2, ...o });
