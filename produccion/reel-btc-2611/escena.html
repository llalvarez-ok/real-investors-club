// tarjeta de Instagram con la foto real de Lean y los números del día
function tarjetaIG(y, k, t, tboton) {
  if (k <= 0) return; X.save(); X.globalAlpha = cl(k * 2); X.translate(0, 60 * (1 - out3(k)));
  rr(150, y, 710, 560, 34); X.fillStyle = 'rgba(13,33,66,.94)'; X.fill(); X.lineWidth = 2.5; X.strokeStyle = hex(ORO, .55); X.stroke();
  X.save(); X.beginPath(); X.arc(290, y + 150, 95, 0, 7); X.clip(); X.drawImage(IMG.lean, 195, y + 55, 190, 190); X.restore();
  X.strokeStyle = ORO; X.lineWidth = 5; X.beginPath(); X.arc(290, y + 150, 97, 0, 7); X.stroke();
  texto('leanalvarez.ok', 410, y + 125, `800 44px ${SANS}`, C.txt, 'left', 1); texto('Lean Alvarez | Trading & Finanzas', 410, y + 180, `500 25px ${SANS}`, C.txt2, 'left', 1);
  [[IGN.pub, 'publicaciones', 270], [IGN.seg, 'seguidores', 505], [IGN.sig, 'seguidos', 740]].forEach(([n, s, x]) => {
    texto(fmt(n), x, y + 300, `800 46px ${SANS}`, C.txt, 'center', 1, { id: 'n' + s }); texto(s, x, y + 348, `500 24px ${SANS}`, C.txt2, 'center', 1, { id: 'l' + s }); });
  const kb = ramp(t, tboton, .3); rr(200, y + 410, 610, 100, 20); X.fillStyle = kb > .5 ? '#262a33' : '#0095f6'; X.fill();
  texto(kb > .5 ? 'Siguiendo ✓' : 'Seguí esta cuenta', ZC, y + 461, `800 40px ${SANS}`, '#fff', 'center', 1, { id: 'boton' }); X.restore(); }
function tarjetaYT(y, k, t, tboton) {

  const L = IMG.logo, w = 520, h = L ? w * L.naturalHeight / L.naturalWidth : 200; if (L) X.drawImage(L, ZC - w / 2, y - h - 60, w, h);
  rr(150, y, 710, 420, 34); X.fillStyle = 'rgba(13,33,66,.94)'; X.fill(); X.lineWidth = 2.5; X.strokeStyle = hex(ORO, .55); X.stroke();
  texto('Real Investors Club', ZC, y + 100, `900 60px ${TIT}`, C.txt, 'center', 1); texto('@REALinvestorsc', ZC, y + 170, `500 30px ${SANS}`, C.txt2, 'center', 1);
  const kb = ramp(t, tboton, .3); rr(200, y + 250, 610, 110, 22); X.fillStyle = kb > .5 ? '#262a33' : '#ff0033'; X.fill();
  texto(kb > .5 ? 'Suscripto ✓' : 'Suscribite', ZC, y + 306, `800 44px ${SANS}`, '#fff', 'center', 1, { id: 'boton' }); X.restore(); }
