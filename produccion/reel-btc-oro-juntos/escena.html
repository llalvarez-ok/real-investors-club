<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Bitcoin y el oro juntos</title>
<!-- Reel/Short «Bitcoin y el oro cayeron juntos» (23/11/2026, Tomi). Estilo dark-keynote + dataviz con la paleta RIC:
     el gráfico real es la película, un número gigante por pantalla, un acento por pantalla. Cámara: empuje (01), alejamiento
     mientras el eje crece (02), paneo lateral por la línea de tiempo (03), sacudida corta (05), alejamiento final (08).
     Transiciones con el propio gráfico: el eje que crece, el gráfico que se pliega en el punto HOY, la ficha que se abre,
     la línea de un episodio que se transforma en la del siguiente, el gráfico que se pliega en su tarjeta y vuelve.
     Sin grano en la página (va en ffmpeg). ?v=ig | ?v=yt. Contrato: window.cuadro(t), window.EVENTOS, window.listo,
     window.TEXTOS (textos visibles del último cuadro, para herramientas/cine/lectura.js) y window.SUBS (trozos de subtítulo). -->
<script>
  const Q = new URLSearchParams(location.search), V = Q.get('v') || 'ig';
  document.write(`<script src="${Q.get('t') || 'tiempos-' + V + '.js'}"><\/script>`);
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #071426; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ───────────────────────── paleta, tipografías y utilidades ─────────────────────────
const C = { f1: '#071426', f2: '#0d2142', oro: '#e2c68c', oro2: '#c7a35e', oro3: '#8e7140', txt: '#ecf1f9', txt2: '#a3b5d1',
  verde: '#3dd68c', rojo: '#ff6b6b', borde: '#274a80', panel: '#0d2142' };
const TIT = 'Archivo, "Archivo Black", sans-serif', SANS = '"IBM Plex Sans", sans-serif', MONO = '"IBM Plex Mono", monospace';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const io = k => (k = cl(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const out3 = k => 1 - Math.pow(1 - cl(k), 3);
const back = k => { k = cl(k); const s = 1.3; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const ramp = (t, a, d = .35) => cl((t - a) / d);
const win = (t, a, b, d = .3) => Math.min(ramp(t, a, d), 1 - ramp(t, b, d));
const pulso = (t, a, d = .25) => { const k = (t - a) / d; return k < 0 || k > 1 ? 0 : Math.sin(Math.PI * k); };
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r);
  X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function hex(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const fmt = n => Math.round(n).toLocaleString('es-AR').replace(/,/g, '.');
const pct = (v, dec = 0) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dec).replace('.', ',') + ' %';
const fecha = s => s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4);

// registro de textos visibles (para el chequeo de lectura): se anota todo texto dibujado casi opaco y casi en su escala final
let TX = [];
function texto(s, x, y, font, color, align = 'left', a = 1, opt = {}) {
  if (a <= 0 || !s) return; const ga = X.globalAlpha; X.globalAlpha = ga * a; X.font = font; X.fillStyle = color; X.textAlign = align;
  X.textBaseline = 'middle'; X.fillText(s, x, y);
  if (X.globalAlpha >= .9 && !opt.noLeer) { const w = X.measureText(s).width, fs = parseFloat(font.match(/(\d+)px/)[1]);
    const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x, m = X.getTransform();
    const esc = Math.hypot(m.a, m.b);
    if (Math.abs(esc - (opt.escala || esc)) < .04 || !opt.escala) {
      const p = [[x0, y - fs * .5], [x0 + w, y - fs * .5], [x0, y + fs * .5], [x0 + w, y + fs * .5]].map(([u, v]) => [m.a * u + m.c * v + m.e, m.b * u + m.d * v + m.f]);
      TX.push({ id: opt.id || s, text: s, x0: Math.min(...p.map(q => q[0])), y0: Math.min(...p.map(q => q[1])), x1: Math.max(...p.map(q => q[0])),
        y1: Math.max(...p.map(q => q[1])), pass: !!opt.pass }); } }
  X.globalAlpha = ga; }
function chip(s, x, y, color, a = 1, opt = {}) {
  if (a <= 0) return 0; X.save(); X.globalAlpha *= a; X.font = `600 ${opt.fs || 24}px ${MONO}`;
  const w = X.measureText(s).width + 40, h = (opt.fs || 24) + 26, x0 = opt.izq ? x : opt.der ? x - w : x - w / 2;
  X.shadowColor = 'rgba(0,0,0,.45)'; X.shadowBlur = 18; X.shadowOffsetY = 6;
  rr(x0, y - h / 2, w, h, 10); X.fillStyle = 'rgba(5,14,28,.94)'; X.fill(); X.fillStyle = hex(color, .13); X.fill(); X.shadowColor = 'transparent';
  X.lineWidth = 2.5; X.strokeStyle = color; X.stroke();
  texto(s, x0 + 20, y + 1, X.font, opt.tc || color, 'left', 1, opt); X.restore(); return w; }
// título con entrada tipo keynote (sube con un rebote corto) y salida que se pliega hacia arriba
function titulo(partes, y, fs, k, s = 1, x = 505) {
  if (k <= 0 || s <= 0) return; X.save(); const e = back(k), sal = 1 - s;
  X.globalAlpha *= cl(k * 2.2) * cl(s * 2.2);
  X.translate(x, y + 30 * (1 - e) - 26 * sal); X.scale(1, 1 - .5 * sal);
  X.font = `900 ${fs}px ${TIT}`; { const w0 = partes.reduce((a, p) => a + X.measureText(p[0]).width, 0); if (w0 > 700) fs = Math.floor(fs * 700 / w0); X.font = `900 ${fs}px ${TIT}`; }
  const ws = partes.map(p => X.measureText(p[0]).width), tot = ws.reduce((a, b) => a + b, 0); let xx = -tot / 2;
  X.shadowColor = 'rgba(0,0,0,.55)'; X.shadowBlur = 24; X.shadowOffsetY = 6;
  partes.forEach((p, i) => { texto(p[0], xx, 0, `900 ${fs}px ${TIT}`, p[1] || C.txt, 'left', 1, { id: 'tit:' + partes.map(q => q[0]).join(''), noLeer: true }); xx += ws[i]; });
  if (X.globalAlpha >= .9 && s >= 1 && k >= 1) { const m = X.getTransform(); TX.push({ id: 'tit', text: partes.map(q => q[0]).join(''),
    x0: m.e - tot / 2, x1: m.e + tot / 2, y0: m.f - fs / 2, y1: m.f + fs / 2 }); }
  X.restore(); }
// número gigante: dígitos que se acomodan uno por uno (glyph noise breve) con rebote
function numero(s, x, y, fs, color, k, opt = {}) {
  if (k <= 0) return; X.save(); const e = back(k); X.globalAlpha *= cl(k * 2);
  X.translate(x, y); X.scale(lerp(1.25, 1, out3(k)) * (opt.s || 1), lerp(1.25, 1, out3(k)) * (opt.s || 1));
  let txt = s; if (k < .6) { const n = Math.floor(k / .6 * s.length); txt = s.split('').map((ch, i) => i < n || !/\d/.test(ch) ? ch : String((i * 7 + Math.floor(k * 40)) % 10)).join(''); }
  X.shadowColor = hex(color, .45); X.shadowBlur = 50;
  texto(txt, 0, 0, `900 ${fs}px ${TIT}`, color, opt.align || 'center', 1, { id: opt.id || 'num:' + s, noLeer: k < 1 });
  X.restore(); }

// ───────────────────────── tiempos de la voz ─────────────────────────
const T = window.T, B = {}; T.bloques.forEach(b => B[b.id] = b);
const norm = s => s.toLowerCase().replace(/[¿?¡!.,:;«»"()]/g, '').trim();
const ini = id => B[id].ini, fin = id => B[id].ini + B[id].dur;
function W(id, frases, def = 0, n = 0) { if (typeof frases === 'string') frases = [frases];
  for (const f of frases) { const b = B[id], ws = f.split(' ').map(norm), P = b.palabras; let m = n;
    for (let i = 0; i + ws.length <= P.length; i++) if (ws.every((w, j) => norm(P[i + j][2]) === w)) { if (m-- === 0) return P[i][0]; } }
  console.error('Falta «' + frases.join('/') + '» en el bloque ' + id + ' (uso una posición aproximada)'); return B[id].ini + def * B[id].dur; }

const t1 = { plata: W('01', 'plata', .4), importa: W('01', 'importa', .9) };
const t2 = { veinte: W('02', 'veinte', .05), bitcoin: W('02', 'bitcoin', .15), veintisiete: W('02', 'veintisiete', .3), oro: W('02', 'oro', .45),
  doce: W('02', 'doce', .55), anos: W('02', 'años', .7), tres: W('02', 'tres', .85), antes: W('02', 'antes', .95) };
const t3 = { logico: W('03', 'lógico', .05), rebote: W('03', 'rebote', .25), tres: W('03', 'tres meses', .5), paso: W('03', 'pasó', .85) };
const t4 = { ini: ini('04'), bitcoin: W('04', 'bitcoin', .4), mas: W('04', 'más', .55), ochenta: W('04', 'ochenta', .65) };
const t5 = { ini: ini('05'), siguio: W('05', 'siguió', .5), menos: W('05', 'menos', .75) };
const t6 = { ini: ini('06'), mas: W('06', 'más', .3), treinta: W('06', 'treinta', .4), despues: W('06', 'después', .6), caer: W('06', 'caer', .75),
  aca: W('06', 'acá', .9) };
const t7 = { ini: ini('07'), subieron: W('07', 'subieron', .08), dia: W('07', 'día cualquiera', .25), sube: W('07', 'sube', .45), seis: W('07', 'seis', .55),
  diez: W('07', 'diez', .62), casos: W('07', 'tres casos', .8) };
const t8 = { ini: ini('08'), plata: W('08', 'plata', .05), pregunta: W('08', 'pregunta', .25), rebota: W('08', 'rebota', .4),
  aguantarias: W('08', 'aguantarías', .6), repite: W('08', 'repite', .8) };
const t9 = V === 'ig' ? { ini: ini('09'), historia: W('09', 'historia', .1), rebota: W('09', 'rebota', .45), fin: W('09', 'comentarios', .8) }
  : { ini: ini('09'), historia: ini('09'), rebota: W('09', 'suscribite', .2), fin: W('09', 'club', .8) };
// cortes (transiciones hechas con el gráfico)
const S_HOY = t3.tres - .1;            // el gráfico se pliega en el punto HOY de la línea de tiempo
const S_EP = t4.ini - .45;             // la ficha 2020 se abre en el gráfico del episodio
const S_CARD = t7.ini - .1;            // el gráfico del episodio se pliega en su tarjeta
const S_VUELVE = t8.plata - .05;          // vuelve el cuadro 0
const S_CIE = t9.ini - .25;

// ───────────────────────── datos (Yahoo Finance, datos.json) ─────────────────────────
let D = null, R = [], EP = [], N20 = 0, BTC20 = 0, ORO20 = 0, CONT = [];
function prepara(d) {
  D = d; R = d.reciente; N20 = R.length - 21;                     // 20 ruedas: del 23/10 al 20/11
  BTC20 = (R[R.length - 1][1] / R[N20][1] - 1) * 100; ORO20 = (R[R.length - 1][2] / R[N20][2] - 1) * 100;
  EP = d.episodios.slice(0, 3).map(e => ({ ...e, nb: e.serie_btc.map(v => (v / e.serie_btc[20] - 1) * 100), no: e.serie_oro.map(v => (v / e.serie_oro[20] - 1) * 100) }));
  // 2026: después de los 60 días, la curva sigue con los cierres reales hasta el 20/11 (volvió a caer hasta acá)
  const e3 = EP[2], ult = d.reciente.findIndex(r => Math.abs(r[1] - e3.serie_btc[80]) < .01);
  CONT = R.slice(ult + 1).map(r => [(r[1] / e3.serie_btc[20] - 1) * 100, (r[2] / e3.serie_oro[20] - 1) * 100, r[0]]);
}
const BASE_RECIENTE = () => R[N20];   // base 100 = 23/10/2026 (inicio de las 20 ruedas)
// Base de comparación del guion v1 (cálculo propio, BTC-USD 09/2014–11/2026, 3.004 ventanas de 60 ruedas): sube el 58 % de las veces.
const UN_DIA_CUALQUIERA = 58;

// ───────────────────────── eventos de sonido ─────────────────────────
const EV = []; const ev = (t, s) => { if (t >= 0 && t < T.total) EV.push({ t: +t.toFixed(3), s }); };
ev(.05, 'impacto'); ev(t1.plata, 'pop');
ev(t2.veinte, 'whoosh'); ev(t2.veintisiete, 'impacto'); ev(t2.doce, 'pop'); ev(t2.tres, 'tics');
ev(t3.logico, 'pop'); ev(S_HOY, 'whoosh'); ev(S_EP + .1, 'clic');
ev(t4.ochenta, 'sube'); ev(t5.ini - .1, 'whoosh'); ev(t5.menos, 'impacto'); ev(t6.ini - .1, 'whoosh'); ev(t6.treinta, 'sube'); ev(t6.caer, 'pop');
ev(S_CARD, 'whoosh'); ev(t7.subieron, 'pop'); ev(t7.dia, 'clic'); ev(t7.seis, 'tics'); ev(t7.casos, 'sello');
ev(S_VUELVE, 'whoosh'); ev(t8.repite, 'impacto');
ev(S_CIE, 'whoosh'); ev(t9.rebota, 'pop'); ev(t9.fin, 'clic');
EV.sort((a, b) => a.t - b.t); window.EVENTOS = EV;

// ───────────────────────── fondo: azul noche con grilla fina (fija; solo la cámara la mueve) ─────────────────────────
const fondo = document.createElement('canvas'); fondo.width = 1080; fondo.height = 1920;
(() => { const g = fondo.getContext('2d'); const lg = g.createLinearGradient(0, 0, 0, 1920);
  lg.addColorStop(0, C.f1); lg.addColorStop(1, C.f2); g.fillStyle = lg; g.fillRect(0, 0, 1080, 1920);
  const rg = g.createRadialGradient(540, 800, 100, 540, 900, 1200); rg.addColorStop(0, 'rgba(39,74,128,.16)'); rg.addColorStop(1, 'rgba(2,7,15,.55)');
  g.fillStyle = rg; g.fillRect(0, 0, 1080, 1920); })();
function grilla(cam) {   // grilla de mundo: se mueve con la cámara
  X.save(); X.strokeStyle = 'rgba(163,181,209,.06)'; X.lineWidth = 1;
  const z = cam.z, ox = (540 - cam.x * z) % (60 * z), oy = (800 - cam.y * z) % (60 * z);
  for (let x = ox; x < 1080; x += 60 * z) { X.beginPath(); X.moveTo(x, 0); X.lineTo(x, 1920); X.stroke(); }
  for (let y = oy; y < 1920; y += 60 * z) { X.beginPath(); X.moveTo(0, y); X.lineTo(1080, y); X.stroke(); }
  X.restore(); }

// ───────────────────────── cámara ─────────────────────────
// mundo: el gráfico vive alrededor de (540, 800). cam = {x, y, z}: punto del mundo en el centro de la pantalla y zoom.
function camara(t) {
  let z = 1, x = 540, y = 800;
  // 01: empuje lento hacia los finales de las líneas
  z *= 1 + .07 * io(ramp(t, 0, ini('02')));  x += 60 * io(ramp(t, 0, ini('02')));
  // 02: alejamiento mientras el eje crece a 90 días
  z *= 1 - .1 * io(ramp(t, t2.veinte - .2, 1.6)); x -= 60 * io(ramp(t, t2.veinte - .2, 1.6));
  z *= 1 + .03 * io(ramp(t, t2.veinte + 1.6, t3.logico - t2.veinte - 1.6));
  // 03: paneo lateral por la línea de tiempo (en coordenadas de la línea, ver lineaTiempo)
  // 04-06: respiración mínima para que nunca quede quieto
  z *= 1 + .012 * Math.sin(t * .9);
  // 08: vuelve al encuadre del cuadro 0 y se aleja despacio
  if (t > S_VUELVE) { const k = io(ramp(t, S_VUELVE, fin('08') - S_VUELVE)); z = (1.07 - .12 * k) * (1 + .012 * Math.sin(t * .9)); x = 600 - 40 * k; y = 800 + 20 * k; }
  // sacudida corta en 2022
  const sh = Math.max(pulso(t, t5.siguio, .35), pulso(t, t5.menos, .4));
  return { x: x + Math.sin(t * 70) * 9 * sh, y: y + Math.cos(t * 83) * 7 * sh, z, sh }; }
function aplica(cam) { X.translate(540, 800); X.scale(cam.z, cam.z); X.translate(-cam.x, -cam.y); }

// ───────────────────────── gráfico de líneas (caja tweenable) ─────────────────────────
// serie: valores; caja: {x0,x1,y0,y1}; rango x [i0,i1] (puede ser fraccionario), rango y [v0,v1]; prog: hasta qué índice se dibuja
function linea(vals, caja, i0, i1, v0, v1, hasta, col, ancho, opt = {}) {
  const sx = i => lerp(caja.x0, caja.x1, (i - i0) / (i1 - i0)), sy = v => lerp(caja.y1, caja.y0, (v - v0) / (v1 - v0));
  const a = Math.max(0, Math.floor(i0), opt.desde || 0), b = Math.min(vals.length - 1, hasta);
  if (b <= a) return null; X.save(); X.lineJoin = 'round'; X.lineCap = 'round';
  const camino = () => { X.beginPath(); for (let i = a; i <= Math.floor(b); i++) { const p = [sx(i), sy(vals[i])]; i === a ? X.moveTo(...p) : X.lineTo(...p); }
    if (b % 1 > 0 && Math.floor(b) + 1 < vals.length) { const i = Math.floor(b), f = b - i; X.lineTo(lerp(sx(i), sx(i + 1), f), sy(lerp(vals[i], vals[i + 1], f))); } };
  if (opt.area) { camino(); const xe = sx(b); X.lineTo(xe, caja.y1); X.lineTo(sx(a), caja.y1); X.closePath(); const g = X.createLinearGradient(0, caja.y0, 0, caja.y1);
    g.addColorStop(0, hex(col, .16)); g.addColorStop(1, hex(col, 0)); X.fillStyle = g; X.fill(); }
  if (opt.punteada) X.setLineDash(opt.punteada);
  X.shadowColor = hex(col, .55); X.shadowBlur = opt.brillo ?? 18; camino(); X.strokeStyle = col; X.lineWidth = ancho; X.stroke();
  X.restore();
  const i = Math.floor(b), f = b - i, vx = i + 1 < vals.length ? lerp(vals[i], vals[i + 1], f) : vals[i];
  return [lerp(sx(i), sx(Math.min(i + 1, vals.length - 1)), f), sy(vx), vx]; }
function punta(p, col, r = 10, t = 0) { if (!p) return; X.save(); X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 24; X.beginPath(); X.arc(p[0], p[1], r, 0, 7); X.fill();
  X.globalAlpha *= .45 * (.5 + .5 * Math.sin(t * 5)); X.strokeStyle = col; X.lineWidth = 3; X.beginPath(); X.arc(p[0], p[1], r + 10 + 5 * Math.sin(t * 5), 0, 7); X.stroke(); X.restore(); }

// ───────────────────────── 01–02: el presente (BTC y oro, base 100 = 23/10) ─────────────────────────
const CAJA = { x0: 160, x1: 850, y0: 500, y1: 1110 };
function cajaInterp(a, b, k) { return { x0: lerp(a.x0, b.x0, k), x1: lerp(a.x1, b.x1, k), y0: lerp(a.y0, b.y0, k), y1: lerp(a.y1, b.y1, k) }; }
function presente(t, caja, op = {}) {
  const n = R.length, b0 = BASE_RECIENTE(), vb = R.map(r => r[1] / b0[1] * 100), vo = R.map(r => r[2] / b0[2] * 100);
  // eje: de 20 ruedas a 90 ruedas (crece hacia la izquierda en «veinte días»), y en el 08 hacia la derecha para el escenario 2022
  const kx = io(ramp(t, t2.veinte - .2, 1.6)) * (1 - io(ramp(t, S_HOY - 1.2, .01 + 0)) * 0) * (op.volver ? 0 : 1);
  let i0 = lerp(N20, 0, kx), i1 = n - 1 + 1.5;
  if (op.extra) i1 = lerp(n - 1 + 1.5, n - 1 + 62, op.extra);
  const vis = vb.slice(Math.floor(i0)).concat(vo.slice(Math.floor(i0)));
  let v0 = Math.min(...vis) - 4, v1 = Math.max(...vis) + 3;
  if (op.extra) { const ult = vb[n - 1], mn = Math.min(...EP[1].nb.slice(20).map(v => ult * (1 + v / 100))); v0 = lerp(v0, mn - 4, op.extra); }
  // líneas de referencia
  X.save(); X.strokeStyle = 'rgba(163,181,209,.18)'; X.lineWidth = 1.5; X.setLineDash([6, 8]);
  const y100 = lerp(caja.y1, caja.y0, (100 - v0) / (v1 - v0)); X.beginPath(); X.moveTo(caja.x0, y100); X.lineTo(caja.x1, y100); X.stroke(); X.restore();
  texto('100', caja.x0 - 6, y100 - 18, `600 20px ${MONO}`, C.txt2, 'left', .8, { pass: true });
  // 20 ruedas: franja
  const kf = win(t, t2.veinte, S_HOY - .3, .4) + (op.volver ? 1 : 0) * (op.extra ? 0 : 0);
  if (kf > 0 && !op.volver) { const xa = lerp(caja.x0, caja.x1, (N20 - i0) / (i1 - i0)); X.save(); X.globalAlpha *= kf * .9; X.fillStyle = 'rgba(255,107,107,.07)';
    X.fillRect(xa, caja.y0 - 20, caja.x1 - xa, caja.y1 - caja.y0 + 40); X.strokeStyle = hex(C.rojo, .5); X.lineWidth = 2; X.beginPath(); X.moveTo(xa, caja.y0 - 20); X.lineTo(xa, caja.y1 + 20); X.stroke();
    X.restore(); chip('20 RUEDAS', (xa + caja.x1) / 2, caja.y0 - 44, C.rojo, kf * back(ramp(t, t2.veinte, .4)), { fs: 22 }); }
  // dibujo: en el cuadro 0 ya casi completas; terminan de bajar en el primer segundo
  const hasta = op.volver ? n - 1 : lerp(n - 1.8, n - 1, out3(ramp(t, 0, .9)));
  const po = linea(vo, caja, i0, i1, v0, v1, hasta, C.oro, 6, { area: true });
