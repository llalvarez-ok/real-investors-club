<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Historia canal YouTube</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--n1:#071426;--n2:#0d2142;--o1:#e2c68c;--o2:#c7a35e;--o3:#8e7140;--t:#ecf1f9;--t2:#a3b5d1;--b:#274a80;--rojo:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.h{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:'IBM Plex Sans';color:var(--t);
 background:linear-gradient(rgba(39,74,128,.13) 1px,transparent 1px) 0 0/54px 54px,linear-gradient(90deg,rgba(39,74,128,.13) 1px,transparent 1px) 0 0/54px 54px,
 radial-gradient(ellipse at 85% 8%,#163a6e 0%,transparent 50%),linear-gradient(170deg,var(--n2),var(--n1) 70%)}
.oro{background:linear-gradient(180deg,var(--o1),var(--o2) 55%,var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent}
.col{position:absolute;top:260px;left:140px;right:140px;display:flex;flex-direction:column;gap:34px}
.marca{display:flex;align-items:center;gap:18px}
.marca img{height:68px}
.marca span{font-family:'IBM Plex Mono';font-size:24px;letter-spacing:.14em;color:var(--t2)}
h1{font-family:'Archivo';font-weight:900;font-size:88px;line-height:.98;text-transform:uppercase}
.sub{font-size:34px;line-height:1.35;color:var(--t2);margin-top:-10px}
.sub b{color:var(--t);font-weight:600}
.video{border:3px solid var(--o2);border-radius:28px;overflow:hidden;background:var(--n1);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.vimg{position:relative}
.vimg img{display:block;width:100%}
.play{position:absolute;right:22px;bottom:22px;width:104px;height:72px;border-radius:20px;background:#ff3b3b;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.play::after{content:'';border-left:30px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent;margin-left:8px}
.video .pie{display:flex;align-items:center;gap:14px;padding:18px 24px}
.nuevo{flex:none;font-family:'IBM Plex Mono';font-weight:600;font-size:20px;letter-spacing:.1em;color:var(--n1);background:var(--o1);padding:6px 12px;border-radius:6px}
.video .pie span{font-size:25px;font-weight:600;line-height:1.25}
.lista{display:flex;flex-direction:column;gap:14px}
.lista div{font-size:30px;line-height:1.3;display:flex;gap:16px;align-items:center}
.lista i{font-style:normal;flex:none;width:50px;height:50px;border-radius:14px;background:rgba(226,198,140,.14);border:2px solid var(--o3);display:flex;align-items:center;justify-content:center;font-size:26px}
.canal{text-align:center;font-family:'IBM Plex Mono';font-size:26px;color:var(--o1);margin-top:6px}
.toca{text-align:center;font-family:'Archivo';font-weight:800;font-size:34px;color:var(--t);margin-top:-6px}
</style></head><body>
<section class="h" id="h">
 <div class="col">
  <div class="marca"><img src="../../marca/logo-oro.png" alt=""><span>REAL INVESTORS CLUB</span></div>
  <h1>En YouTube voy <span class="oro">más a fondo</span></h1>
  <p class="sub">Lo que no entra en un Reel, <b>explicado paso a paso</b>.</p>
  <div class="video">
    <div class="vimg"><img src="p22.png" alt=""><div class="play"></div></div>
    <div class="pie"><span class="nuevo">NUEVO</span><span>Por qué podés perder 8 veces seguidas y ganar el mes</span></div>
  </div>
  <div class="lista">
    <div><i>🔴</i>Vivos en la apertura de Nueva York</div>
    <div><i>🧠</i>Psicología del trading</div>
    <div><i>⚡</i>Noticias del mercado en 1 minuto</div>
  </div>
  <div class="toca">Tocá el link y suscribite 👇</div>
 </div>
</section>
</body></html>
